const tip=document.createElement("div");
tip.className="tip"; tip.id="tip"; tip.setAttribute("role","tooltip"); tip.style.display="none"; document.body.appendChild(tip);
const tipAberto=()=>tip.style.display==="block";
function escondeTip(){ if(!tip.classList.contains("fixo")) tip.style.display="none"; }
// teclado: o tooltip abre ao focar o elemento, posicionado junto dele
function mostraTipEm(el){
  tip.innerHTML=decodeURIComponent(el.dataset.tip); tip.style.display="block";
  const r=el.getBoundingClientRect(), t=tip.getBoundingClientRect();
  let x=r.left, y=r.bottom+8;
  if(x+t.width>innerWidth-10) x=Math.max(8,innerWidth-t.width-10);
  if(y+t.height>innerHeight-10) y=Math.max(8,r.top-t.height-8);
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
document.addEventListener("focusin",e=>{
  if(tip.classList.contains("fixo")||!(e.target instanceof Element)) return;
  const el=e.target.closest("[data-tip]"); if(!el) return;
  el.setAttribute("aria-describedby","tip"); mostraTipEm(el);
});
document.addEventListener("focusout",e=>{ if(e.target instanceof Element&&e.target.closest("[data-tip]")) escondeTip(); });
// toque: o tooltip aberto por um toque fecha ao tocar fora
document.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse"&&!(e.target instanceof Element&&e.target.closest("[data-tip]"))) escondeTip(); });
function moveTip(e){
  const p=14; const r=tip.getBoundingClientRect();
  let x=e.clientX+p, y=e.clientY+p;
  if(x+r.width>innerWidth-10) x=e.clientX-r.width-p;
  if(y+r.height>innerHeight-10) y=Math.max(8,e.clientY-r.height-p);
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
document.addEventListener("mouseover",e=>{
  if(tip.classList.contains("fixo")) return;
  const el=e.target.closest("[data-tip]");

  tip.innerHTML=decodeURIComponent(el.dataset.tip);

});
let _tipRaf=0, _tipEv=null;   // um reposicionamento por quadro (evita layout forçado a cada mousemove)
document.addEventListener("mousemove",e=>{
  if(tip.style.display!=="block" || tip.classList.contains("fixo")) return;
  _tipEv=e; if(!_tipRaf) _tipRaf=requestAnimationFrame(()=>{ _tipRaf=0; if(_tipEv) moveTip(_tipEv); }); });
document.addEventListener("mouseout",e=>{
  if(tip.classList.contains("fixo")) return;
  if(e.target.closest("[data-tip]")) tip.style.display="none"; });

/* ============ HISTÓRICO DE LANÇAMENTO ============ */
// meses fechados em que a conta x unidade teve realizado
function histDe(d){
  return refMeses().filter(i=>Math.abs(d.r[i])>EPS).map(i=>DB.meses[i]);
}
function tipHist(hist,cf){
  const fech=refMeses().length;
  if(!fech) return `<b>Sem histórico</b><div class="tl">Não há mês fechado antes de ${faixaLbl()} para comparar.</div>`;
  if(!hist.length) return `<b>Nunca lançou</b><div class="tl">Nenhum lançamento nos ${fech} meses de referência. Pode ser conta inativa ou orçamento indevido.</div>`;
  return `<b>Lançou ${hist.length} de ${fech} meses</b>
    <div class="tl">Meses com lançamento: ${hist.join(", ")}</div>
    <div class="tl">Último lançamento: <b>${hist[hist.length-1]}</b></div>
    ${cf==="alta"?`<div class="tl" style="color:var(--fg-neg)">Lançava com regularidade e parou — falha provável.</div>`:""}`;
}

function escopoUnidades(){
  const {a}=met();

    view.tipo==="hub"?true: view.tipo==="seg"? o.seg===view.seg : o.cod===view.unit);
}
function semLancEscopo(){
  const {aberto,est}=met();

  const out=[];
  DB.data.forEach(d=>{
    if(!un.has(d.u)||!relevante(d)) return;
    const [p,r]=agr(d);
    if(statusConta(d,p,r,aberto,est[d.u])!=="sem") return;
    out.push({u:d.u,a:d.a,p,cf:confDe(d),hist:histDe(d)});
  });
  return out;
}
// top contas sem lançamento de UMA unidade (para o hover do ranking)
function topContasUnidade(cod,n){
  const {aberto,est}=met(), out=[];
  dadosDe(cod).forEach(d=>{
    if(!relevante(d)) return;
    const [p,r]=agr(d);
    if(statusConta(d,p,r,aberto,est[cod])!=="sem") return;
    out.push({a:d.a,p:Math.abs(p),cf:confDe(d)});
  });
  out.sort((x,y)=>y.p-x.p);
  return {total:out.length, soma:out.reduce((s,o)=>s+o.p,0), top:out.slice(0,n)};
}

/* ============ GERADOR DE XLSX (multi-aba) ============ */
const _crcT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}
  return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=_crcT[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipar(files){
  const enc=new TextEncoder(), locais=[], centrais=[]; let off=0, total=0;
  files.forEach(f=>{
    const nb=enc.encode(f.name), data=f.data, crc=crc32(data), sz=data.length;
    const lh=new Uint8Array(30+nb.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,sz,true); dv.setUint32(22,sz,true);
    dv.setUint16(26,nb.length,true);
    lh.set(nb,30);
    locais.push(lh,data); total+=lh.length+sz;
    const ch=new Uint8Array(46+nb.length), d2=new DataView(ch.buffer);
    d2.setUint32(0,0x02014b50,true); d2.setUint16(4,20,true); d2.setUint16(6,20,true);
    d2.setUint32(16,crc,true); d2.setUint32(20,sz,true); d2.setUint32(24,sz,true);
    d2.setUint16(28,nb.length,true); d2.setUint32(42,off,true);
    ch.set(nb,46); centrais.push(ch);
    off+=lh.length+sz;
  });
  const cdSize=centrais.reduce((s,c)=>s+c.length,0);
  const eocd=new Uint8Array(22), de=new DataView(eocd.buffer);
  de.setUint32(0,0x06054b50,true);
  de.setUint16(8,files.length,true); de.setUint16(10,files.length,true);
  de.setUint32(12,cdSize,true); de.setUint32(16,total,true);
  const out=new Uint8Array(total+cdSize+22); let pos=0;
  locais.forEach(b=>{out.set(b,pos);pos+=b.length;});
  centrais.forEach(b=>{out.set(b,pos);pos+=b.length;});
  out.set(eocd,pos);
  return out;
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function colL(n){let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
function abaXML(a){
  const linhas=a.linhas, hdr=a.hdr||0, pct=new Set(a.pct||[]), int=new Set(a.int||[]), link=a.link||false;
  const rows=linhas.map((row,i)=>{
    const nr=i+1;
    const cs=row.map((v,j)=>{
      const ref=colL(j+1)+nr;
      let st=0;
      if(nr===hdr) st=1;
      else if(a.titulos&&a.titulos.includes(nr)) st=4;
      else if(typeof v==="number") st=pct.has(j)?3:(int.has(j)?0:2);
      else if(link&&hdr&&nr>hdr&&j===0) st=5;
      if(typeof v==="number" && isFinite(v)) return `<c r="${ref}" s="${st}"><v>${v}</v></c>`;
      if(v===null||v===undefined||v==="") return "";
      return `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
    }).join("");
    return `<row r="${nr}">${cs}</row>`;
  }).join("");
  const cols=(a.larg||[]).map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
  const nC=Math.max(...linhas.map(r=>r.length),1);
  const filtro=hdr?`<autoFilter ref="A${hdr}:${colL(nC)}${linhas.length}"/>`:"";
  const painel=hdr?`<sheetViews><sheetView workbookViewId="0"><pane ySplit="${hdr}" topLeftCell="A${hdr+1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`:"";
  const links=(a.hyper||[]).map(h=>`<hyperlink ref="${h.ref}" location="${esc(h.loc)}" display="${esc(h.txt||"")}"/>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${painel}${cols?`<cols>${cols}</cols>`:""}<sheetData>${rows}</sheetData>${filtro}${links?`<hyperlinks>${links}</hyperlinks>`:""}</worksheet>`;
}
function nomeAba(s,usados){
  let n=String(s).replace(/[\\\/\*\?\[\]:]/g,"-").slice(0,28).trim()||"Aba";
  let base=n,i=2; while(usados.has(n.toLowerCase())){ n=(base.slice(0,25)+" "+i); i++; }
  usados.add(n.toLowerCase()); return n;
}

<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>

  abas.forEach((a,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:enc.encode(abaXML(a))}));

const round2=n=>Math.round(n*100)/100;

const hoje=()=>{const d=new Date(),z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());};
const limpaNome=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w-]+/g,"_");

const CAB=["Conta","Descricao da conta","Natureza","Recorrente","Planejado","Realizado","Variacao",
           "Variacao %","Efeito","Status","Confianca","Meses que lancou","Ultimo lancamento",
           "Classificacao"];

// Todas as contas de uma unidade no período e no modo atuais.
// Lista completa: ignora filtro/busca da tela, mas RESPEITA modo e período.
function linhasUnidade(cod){
  const {aberto,est}=met(), out=[];
  dadosDe(cod).forEach(d=>{
    if(modo==="rec" && !ehRec(d.a)) return;      // só recorrentes no modo recorrentes
    const [p,r]=agr(d);                          // agrega os meses do período
    if(Math.abs(p)<EPS && Math.abs(r)<EPS) return;
    const ac=amap[d.a]||{desc:"",rec:"—",fv:"—"};
    out.push({a:d.a,desc:ac.desc,nat:natureza(d.a),p,r,v:r-p,d,
      pct:Math.abs(p)>EPS?((r-p)/Math.abs(p)*100):null,
      fav:favor(r-p),
      st:statusConta(d,p,r,aberto,est[cod]), cf:confDe(d), hist:histDe(d),
      rec:ehRec(d.a)?"Sim":"Nao",
      cls:(ac.fv||"—")+" · "+recTexto(d.a)});
  });
  out.sort((x,y)=>(STO[x.st]-STO[y.st])||Math.abs(y.p)-Math.abs(x.p));
  return out;
}
const linhaXLS=r=>[r.a,r.desc,r.nat,r.rec,round2(r.p),round2(r.r),round2(r.v),
   r.pct==null?"":+r.pct.toFixed(1), r.st==="sem"?"":FAVLBL[r.fav],
   ST[r.st], r.st==="sem"?CONF[r.cf]:"",
   r.hist.length, r.hist.length?r.hist[r.hist.length-1]:"", r.cls];

// aba de resumo / índice (uma linha por unidade, com link para a aba dela)
const CAB_RES=["Segmento","Cod. unidade","Unidade","Periodo","Contas com orcamento",
  "Contas sem lancamento","Lancavam todo mes","Lanca as vezes","Nunca lancou","Sem historico",
  "R$ exposto","Planejado","Realizado","Variacao","Efeito"];
const LARG_RES=[14,12,30,9,13,14,13,13,12,12,15,15,15,15,13];
const LARG_UNI=[15,42,14,11,15,15,15,11,13,16,16,10,10,26];

function exportaConjunto(uns,nomeArq){
  // unidade exportada sozinha sempre ganha a aba dela, mesmo sem pendência
  const comAba=uns.filter(o=>o.sem>0||uns.length===1).sort((x,y)=>y.expo-x.expo);
  const usados=new Set(); const nomes={};
  comAba.forEach(o=>{ nomes[o.cod]=nomeAba(o.nome,usados); });

  // --- índice ---
  const li=[[`Análise de variação · ${faixaLbl()} · ${MODOLBL[modo]}`],
            [`${uns.length} unidades · ${comAba.length} com contas pendentes${modo==="rec"?" nas "+N_REC+" contas recorrentes":""} · clique no nome para abrir a aba`],
            [], CAB_RES];
  const hyper=[];
  uns.sort((x,y)=>y.expo-x.expo).forEach((o,k)=>{
    // mesma regra do cartão (relevante): as colunas de confiança somam "Contas sem lançamento"
    const rs=linhasUnidade(o.cod).filter(r=>r.st==="sem"&&relevante(r.d));
    const c={alta:0,media:0,baixa:0,nd:0}; rs.forEach(r=>c[r.cf]++);
    const v=o.real-o.plan;
    li.push([SEGNM[o.seg],o.cod,o.nome,faixaLbl(),o.orc,o.sem,
      c.alta,c.media,c.baixa,c.nd,round2(o.expo),round2(o.plan),round2(o.real),round2(v),FAVLBL[favor(v)]]);
    if(nomes[o.cod]) hyper.push({ref:"C"+(li.length),loc:`'${nomes[o.cod].replace(/'/g,"''")}'!A1`,txt:o.nome});
  });
  const abas=[{nome:"Resumo",linhas:li,hdr:4,larg:LARG_RES,titulos:[1],
               hyper,link:false}];
  // marca a coluna C como link (estilo) — feito via hyper acima
  comAba.forEach(o=>{
    const rs=linhasUnidade(o.cod);
    const l=[[`${o.nome} (${o.cod}) — ${SEGNM[o.seg]} — ${faixaLbl()} (${PERLBL[periodo]})`],
             [`${MODOLBL[modo]}${modo==="rec"?" — só as "+N_REC+" contas recorrentes":""} · ${o.sem} contas com orçamento e sem lançamento · R$ ${Math.round(o.expo).toLocaleString("pt-BR")} exposto`],
             [], CAB];
    rs.forEach(r=>l.push(linhaXLS(r)));
    l.push([]); l.push(["« voltar ao Resumo"]);
    abas.push({nome:nomes[o.cod],linhas:l,hdr:4,pct:[7],larg:LARG_UNI,titulos:[1],
               hyper:[{ref:"A"+l.length,loc:"Resumo!A4",txt:"« voltar ao Resumo"}]});
  });
  baixaXLSX(nomeArq,abas);
}
function exportUnidade(){
  const {a}=met(); let o=a[view.unit];
  if(!o&&ehVigUn(view.unit)){ const u=umap[view.unit], ls=linhasUnidade(u.cod);   // vigiada: fora de met()
    o={cod:u.cod,nome:u.nome,seg:u.seg,sem:0,orc:ls.filter(l=>Math.abs(l.p)>EPS).length,expo:0,
       plan:ls.reduce((s,l)=>s+l.p,0),real:ls.reduce((s,l)=>s+l.r,0)}; }
  if(!o) return;
  exportaConjunto([o],`variacao_${modo==="rec"?"recorrentes_":""}${limpaNome(o.nome)}_${limpaNome(faixaLbl())}_${hoje()}.xlsx`);

function exportGeral(){

// Espelho do orçamento sem lastro: contas lançadas mês após mês e nunca
// orçadas. É gasto recorrente fora do orçamento — insumo do próximo ciclo.
function lastroSemOrc(minMeses){ return memo("lastroSemOrc",_lastroSemOrc,minMeses); }
function _lastroSemOrc(minMeses){
  const fech=[...Array(12).keys()].filter(i=>DB.fechado[i] && !ehParcial(i));
  const out=[];
  DB.data.forEach(d=>{
    if(!ehPendencia(d.a)) return;
    if(modo==="rec" && !ehRec(d.a)) return;
    const mr=fech.filter(i=>Math.abs(d.r[i])>EPS).length;
    const mo=fech.filter(i=>Math.abs(d.p[i])>EPS).length;
    if(mr<minMeses || mo>0) return;
    const val=fech.reduce((s,i)=>s+Math.abs(d.r[i]),0);
    if(corte>0 && val<corte) return;
    out.push({u:d.u,nome:(umap[d.u]||{}).nome||d.u,seg:(umap[d.u]||{}).seg,
              a:d.a,desc:(amap[d.a]||{}).desc||d.a,meses:mr,val,
              media:val/(mr||1), rec:ehRec(d.a)});
  });
  return out.sort((x,y)=>y.val-x.val);
}

/* ---------- roteamento ---------- */
function go(v){
  view={...view,...v};
  // vigiada: o que importa é o movimento, não a pendência → abre em "Variações", com todas as contas
  if(v.tipo==="det"){ const vg=ehVigUn(view.unit); aba=vg?"var":"pend"; view.filtro=vg?"todos":"sem"; view.busca=""; view.sk="st"; view.sd=1; }
  else { view.filtro="todos"; view.busca=""; view.sk="st"; view.sd=1; aba="pend"; }
  expandida=null;
  render();
  const calmo=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({top:0,behavior:calmo?"auto":"smooth"});
}
var render=function(){
  const aberto=met().aberto;

    document.getElementById("title").textContent="Orçamento sem lastro";

    +(corte>0?` <span class="modotag" style="background:var(--bg-neu);color:var(--mut)">ignorando abaixo de R$ ${fmtN(corte)}</span>`:"")
    +(mesesAtivos().some(ehAberto)?(()=>{ const ab=mesesAtivos().filter(ehAberto);
      return ` <span class="modotag parc" ${T(`<b>Mês em aberto</b>
        <div class="tl">${ab.map(rotMes).join(", ")} ainda está na semana de ajustes do fechamento (até ${prazoMes(ab[ab.length-1])}).
        Os números já aparecem, mas podem mudar até o fechamento.</div>`)}>em aberto · prazo de ajustes até ${prazoMes(ab[ab.length-1])}</span>`; })():"")
    +(mesesAtivos().some(ehParcial)?` <span class="modotag parc" ${T(`<b>Fechamento parcial</b>
        <div class="tl">Este mês tem bem menos lançamentos que os demais (${PARCIAL.tot[M]||0} contra ~${PARCIAL.med} de mediana).
        Provavelmente ainda está sendo lançado, então as pendências tendem a cair.</div>
        <div class="tl">Meses parciais ficam fora do cálculo de tendência.</div>`)}>fechamento parcial</span>`:"");
  const ms2=document.getElementById("mstatus");

  const tt=document.getElementById("tbtitulo"), ts=document.getElementById("tbsub");

// carimbo da base: no fluxo de pasta sincronizada é fácil abrir um export velho.
// A referência é a data de modificação do CSV (o painel é montado na hora da abertura).
function carimbo(){
  try{
  const el=document.getElementById("gerado");
  if(!el) return;
  const c=DB.carga||{};
  const ref=c.modificado?new Date(c.modificado):(DB.gerado?new Date(DB.gerado):null);
  const av=avisosCarga();
  let txt="";
  if(ref&&!isNaN(ref)){
    const dias=Math.floor((Date.now()-ref.getTime())/86400000);
    const dt=ref.toLocaleDateString("pt-BR")+" "+ref.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    const velho=c.modificado&&dias>CFG.diasBaseVelha;
    el.className="gerado"+(velho?" velho":"");
    txt=(c.arquivo?`Base <b>${he(c.arquivo)}</b><br>`:"")
      +`${c.modificado?"Arquivo de":"Dados gerados em"} <b>${dt}</b>`
      +(velho?`<br><b>há ${dias} dias — pode estar desatualizado</b>`:"");
  }
  el.innerHTML=txt+`<br><button class="lnk${av.length?" av":""}" id="bcarga">${av.length?`${ic("alerta")} ${av.length} aviso(s) na carga`:"Resumo da carga"}</button>`
    +` · <button class="lnk" id="btroca" title="Volta à tela de carga mantendo a tela atual no endereço">Trocar base</button>`;
  document.getElementById("bcarga").onclick=()=>{ if(window.fechaMenu) fechaMenu(); abreCarga(); };
  const baj=document.getElementById("bajrec"); if(baj) baj.onclick=()=>{ if(window.fechaMenu) fechaMenu(); abreAjustesRec(); };
  // nova base: recarrega a página (o endereço guarda a tela atual) e volta à tela de carga
  document.getElementById("btroca").onclick=()=>location.reload();
  }catch(e){}
}

/* ---------- editor de recorrentes e periodicidade ---------- */
let ajRasc=null, ajFiltro={q:"",ver:"todas"};
const PER_PASSO={bimestral:2,trimestral:3,quadrimestral:4,semestral:6,anual:12};
function contasAjuste(){
  const usadas=new Set(DB.data.map(d=>d.a));
  return DB.accts.filter(a=>usadas.has(a.cod)&&!a.cod.startsWith("3"));
}
const recRasc=a=>a.cod in ajRasc.rec?ajRasc.rec[a.cod]:!!a.r;
function linhaAjuste(a){
  const ms=ajRasc.meses[a.cod], tp=tipoPeriodo(ms), sug=sugereMeses(a.cod), mud=(a.cod in ajRasc.rec)||!!ms;
  const ops=["mensal","bimestral","trimestral","quadrimestral","semestral","anual","personalizada"].map(t=>`<option${t===tp?" selected":""}>${t}</option>`).join("");
  return `<tr data-a="${he(a.cod)}"${mud?' class="mud"':""}>
    <td><input type="checkbox" class="ajr"${recRasc(a)?" checked":""} aria-label="Recorrente: ${he(a.cod)}" onchange="ajRec(${js(a.cod)},this.checked)"></td>
    <td><b>${he(a.cod)}</b> ${he(a.desc||"")}<div class="ajd">planilha: ${a.r?"recorrente":"não recorrente"}${sug?` · lançamentos observados: ${perTexto(sug)} <button class="lnk" onclick="ajUsa(${js(a.cod)})">usar</button>`:""}</div></td>
    <td><select class="fsel" aria-label="Periodicidade: ${he(a.cod)}" onchange="ajPer(${js(a.cod)},this.value)">${ops}</select>
      ${ms?`<div class="ajm">${MESES_ABR.map((m,i)=>`<label><input type="checkbox"${ms.includes(i)?" checked":""} onchange="ajMes(${js(a.cod)},${i},this.checked)">${m}</label>`).join("")}</div>`:""}</td></tr>`;
}
function desenhaAjustes(){
  const tb=document.querySelector("#ajrec tbody"); if(!tb) return;
  const q=semAcento(ajFiltro.q);
  const lst=contasAjuste().filter(a=>(!q||semAcento(a.cod+" "+(a.desc||"")).includes(q))
    &&(ajFiltro.ver==="todas"||(ajFiltro.ver==="rec"?recRasc(a):(a.cod in ajRasc.rec)||!!ajRasc.meses[a.cod])));
  tb.innerHTML=lst.map(linhaAjuste).join("")||`<tr><td colspan="3" class="ajd">Nenhuma conta com esse filtro.</td></tr>`;
  const n=Object.keys(ajRasc.rec).length+Object.keys(ajRasc.meses).filter(k=>!(k in ajRasc.rec)).length;
  document.getElementById("ajInfo").textContent=`${lst.length} conta(s) · ${n} ajustada(s)`;
}
function redesenhaLinha(cod){
  const tr=document.querySelector(`#ajrec tr[data-a="${CSS.escape(cod)}"]`);
  if(tr) tr.outerHTML=linhaAjuste(amap[cod]);
}
function ajRec(cod,v){ if(v===!!amap[cod].r) delete ajRasc.rec[cod]; else ajRasc.rec[cod]=v; redesenhaLinha(cod); }
function ajPer(cod,t){
  if(t==="mensal"){ delete ajRasc.meses[cod]; }
  else if(t!=="personalizada"){
    const ini=(ajRasc.meses[cod]||sugereMeses(cod)||[0])[0], passo=PER_PASSO[t], out=[];
    for(let i=ini%passo;i<12;i+=passo) out.push(i);
    ajRasc.meses[cod]=t==="anual"?[ini]:out;
  } else if(!ajRasc.meses[cod]) ajRasc.meses[cod]=[...Array(12).keys()];
  redesenhaLinha(cod);
}
function ajMes(cod,i,on){
  const s=new Set(ajRasc.meses[cod]||[...Array(12).keys()]); on?s.add(i):s.delete(i);
  const ms=[...s].sort((a,b)=>a-b);
  if(ms.length===12) delete ajRasc.meses[cod]; else ajRasc.meses[cod]=ms;
  redesenhaLinha(cod);
}
function ajUsa(cod){ const s=sugereMeses(cod); if(s) ajRasc.meses[cod]=s; else delete ajRasc.meses[cod]; redesenhaLinha(cod); }

    </div>
    <div class="guiaf">Os ajustes ficam salvos neste navegador${window.__gravaAjustesPasta__?" e no arquivo fpa-ajustes.json da pasta":""}. Exporte o .json para levar a outro computador ou compartilhar com o time.</div></div>`;

function exportaAjustes(){
  const t=JSON.stringify({versao:1,...ajRasc,salvoEm:new Date().toISOString()},null,1);

  el.download="fpa-ajustes.json"; document.body.appendChild(el); el.click(); document.body.removeChild(el);
  URL.revokeObjectURL(el.href);
}
function importaAjustesArq(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  f.text().then(t=>{ const o=validaAjustes(JSON.parse(t)); ajRasc={rec:o.rec,meses:o.meses}; desenhaAjustes(); })
   .catch(e=>alert(/ajustes/.test(e.message)?e.message:"Arquivo de ajustes inválido: não é JSON."));
  inp.value="";
}

/* ---------- resumo da carga (conciliação com o Plano) ---------- */
function avisosCarga(){
  const c=DB.carga; if(!c) return [];
  const a=[];
  if(c.invalidos) a.push(`${fmtN(c.invalidos)} célula(s) de valor fora do formato pt-BR (convertidas como no gerador original)`);
  if(c.curtas) a.push(`${fmtN(c.curtas)} linha(s) com menos colunas que o esperado (valores faltantes contam como zero)`);
  if(c.cabecalho&&c.cabecalho.nota) a.push(c.cabecalho.nota);
  if(c.semSegmento&&c.semSegmento.length) a.push(`${c.semSegmento.length} unidade(s) sem segmento definido`);
  return a;
}
// status de um mês no resumo da carga, com o motivo quando está em aberto
const ehAberto=i=>!!(DB.emAberto&&DB.emAberto[i]);
// último dia do prazo de ajustes do mês (ex.: "07/10")
function prazoMes(i){ const f=DB.carga&&DB.carga.fechamento&&DB.carga.fechamento.meses[i];
  return f?new Date(f.abreEm-86400000).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}):""; }
function statusMesCarga(i){
  const f=DB.carga&&DB.carga.fechamento&&DB.carga.fechamento.meses[i];
  if(ehAberto(i)) return "em aberto · prazo de ajustes até "+prazoMes(i)+(ehParcial(i)?" · parcial":"");
  if(DB.fechado[i]) return ehParcial(i)?"fechado · parcial":"fechado";
  if(f&&f.temReal) return "futuro · lançamento antecipado (fora da análise)";
  return "em aberto · sem realizado";
}

        <h2 class="gt" id="cargat">Resumo da carga</h2>
        <div class="gs">Confira os totais com o Plano antes de analisar.</div></div>
      <button class="gx" aria-label="Fechar" onclick="fechaGuia()">${ic("x")}</button></div>
    <div class="guial" tabindex="0">
      ${av.length?`<div class="gp"><div class="gpt" style="color:var(--amb)">${ic("alerta")} Avisos</div><div class="gpd">${av.map(he).join("<br>")}</div>
        ${(c.amostrasInv||[]).length?`<table class="mini" style="margin-top:8px"><thead><tr><th>Linha</th><th>Coluna</th><th>Valor no arquivo</th></tr></thead>
          <tbody>${c.amostrasInv.map(x=>`<tr><td class="num">${x.linha}</td><td class="num">${x.coluna}</td><td class="num">${he(x.valor)}</td></tr>`).join("")}</tbody></table>`:""}
        ${(c.semSegmento||[]).length?`<div class="expl2">Unidades sem segmento:</div>${lista(c.semSegmento)}`:""}</div>`:""}
      <div class="gp"><div class="gpt">Arquivo</div><div class="gpd">
        ${lin("Nome",he(c.arquivo||"—"))}${lin("Tamanho",c.tamanho?(c.tamanho/1e6).toFixed(1).replace(".",",")+" MB":"—")}
        ${lin("Modificado em",c.modificado?new Date(c.modificado).toLocaleString("pt-BR"):"—")}${lin("Codificação",he(c.encoding||"—"))}
        ${lin("Ano da base",ANO+(c.anoFonte?" · pelo "+he(c.anoFonte):""))}
        ${c.fechamento?lin("Fechamento",`mês com realizado e ${c.fechamento.prazoDias} dias corridos após o fim, pela ${he(c.fechamento.fonte)} (${new Date(c.fechamento.referencia).toLocaleDateString("pt-BR")})`):""}</div></div>
      <div class="gp"><div class="gpt">Linhas</div><div class="gpd">
        ${lin("Lidas (sem o cabeçalho)",n(c.linhas))}${lin("Aproveitadas (família A)",n(c.usadas))}
        ${lin("Ignoradas — unidade fora da família A",n(c.naoA),1)}${lin("Ignoradas — DUMMYA",n(c.dummy),1)}
        ${lin("Ignoradas — sem código de conta",n(c.semConta),1)}${lin("Ignoradas — linhas vazias",n(c.vazias),1)}
        ${lin("Combinações conta × unidade",n(DB.data.length))}
        ${lin("Unidades",n(DB.units.length)+" ("+DB.units.filter(u=>u.vig).length+" vigiadas)")}${lin("Contas",n(DB.accts.length))}
        ${Object.keys(ALIAS).length?lin("Unidades unificadas",Object.entries(ALIAS).map(([d,o])=>he(o.join(" + ")+" → "+d)).join(" · ")):""}</div></div>
      <div class="gp"><div class="gpt">Totais por mês — todas as unidades A (inclusive vigiadas)</div>
        <table class="mini" style="margin-top:6px"><thead><tr><th>Mês</th><th class="r">Planejado</th><th class="r">Realizado</th><th class="r">Variação</th><td></td></tr></thead>
        <tbody>${tot}</tbody></table></div>
      ${(c.fusoes||[]).map(f=>`<div class="gp"><div class="gpt">Conta fundida: ${he(f.origem)} → ${he(f.destino)}</div>
        <div class="gpd">${f.linhas?`${n(f.linhas)} linha(s) de ${n(f.unidades)} unidade(s) da ${he(f.origem)} somadas em <b>${he((amap[f.destino]||{}).desc||f.destino)}</b>.
          Se a conta de destino aparece sem lançamento, confira abaixo se a ${he(f.origem)} tinha realizado no mês.`
          :`Nenhuma linha da ${he(f.origem)} nesta base.`}</div>
        ${f.linhas?`<table class="mini" style="margin-top:6px"><thead><tr><th>Mês</th><th class="r">Orçado (${he(f.origem)})</th><th class="r">Realizado (${he(f.origem)})</th><td></td></tr></thead>
          <tbody>${DB.meses.map((m,i)=>DB.fechado[i]?`<tr><td>${rotMes(i)}</td><td class="r num">${fmtC(f.p[i])}</td><td class="r num">${fmtC(f.r[i])}</td>
            <td class="nat">${ehAberto(i)?"em aberto":""}</td></tr>`:"").join("")}</tbody></table>`:""}</div>`).join("")}
      ${(c.semClassif||[]).length?`<div class="gp"><div class="gpt">Contas fora da tabela de classificação (${c.semClassif.length})</div>
        <div class="gpd">São tratadas como não recorrentes. Se alguma deveria ser recorrente, atualize a tabela CLASSIF.</div>${lista(c.semClassif,10)}</div>`:""}
    </div>
    <div class="guiaf">Esc fecha</div></div>`;
  el.classList.add("on"); modal(el,true); el.querySelector(".gx").focus();
}

/* ---------- estado na URL (permite salvar o próprio favorito) ---------- */
let urlOk=true;   // alguns navegadores barram alterar a URL em arquivo local
function gravaURL(){
  if(!urlOk) return;
  try{
  const p=new URLSearchParams();
  if(view.tipo!=="hub") p.set("v",view.tipo);
  if(view.seg) p.set("seg",view.seg);
  if(view.unit) p.set("un",view.unit);
  if(modo!=="geral") p.set("m",modo);
  if(periodo!=="mes") p.set("p",periodo);
  if(corte>0) p.set("c",corte);
  if(view.tipo==="hub"&&vhub==="ct") p.set("hv","ct");
  p.set("mes",M);
  history.replaceState(null,"","#"+p.toString());
  }catch(e){ urlOk=false; }   // segue funcionando, só não guarda o estado no endereço
}
function leURL(){
  try{
  const h=location.hash.replace(/^#/,"");
  if(!h) return false;
  const p=new URLSearchParams(h);
  if(p.has("m")) modo=p.get("m")==="rec"?"rec":"geral";
  if(p.has("p")) periodo=["acum","sem"].includes(p.get("p"))?p.get("p"):"mes";
  if(p.has("c")) corte=+p.get("c")||0;
  if(p.has("mes")){ const i=+p.get("mes"); if(i>=0&&i<12) M=i; }
  if(p.get("hv")==="ct") vhub="ct";
  const v=p.get("v"), sg=p.get("seg"), un=p.get("un");
  if(["lastro","lsorc","exc"].includes(v)) view.tipo=v;
  else if(v==="seg"&&sg&&DB.units.some(u=>u.seg===sg)){ view.tipo="seg"; view.seg=sg; }
  else if(v==="det"&&un&&umap[_UNIFICAR[un]||un]){ const u2=_UNIFICAR[un]||un;   // link antigo de unidade unificada
    view.tipo="det"; view.unit=u2; view.seg=umap[u2].seg; }
  return true;
  }catch(e){ return false; }
}
function sincronizaBotoes(){
  const marca=(b,on)=>{ b.classList.toggle("on",on); b.setAttribute("aria-pressed",on?"true":"false"); };
  document.querySelectorAll("#modobar button").forEach(b=>marca(b,b.dataset.m===modo));
  document.querySelectorAll("#perbar button").forEach(b=>marca(b,b.dataset.p===periodo));
  document.querySelectorAll("#cortebar button").forEach(b=>marca(b,+b.dataset.c===corte));
  const sel=document.getElementById("mes"); if(sel) sel.value=M;
}

function protege(fn,nome){
  return function(){ try{ return fn.apply(this,arguments); }
    catch(e){
      const el=document.getElementById("body");
      if(el) el.innerHTML=`<div class="empty">Não foi possível montar esta tela.<br>
        <span style="font-size:11px;color:var(--dim)">${nome}: ${e.message}</span></div>`;
      console.error(nome,e);
    }};
}
render=protege(render,"render");

(function init(){
  const sel=document.getElementById("mes");
  sel.innerHTML=DB.meses.map((m,i)=>
    `<option value="${i}" ${i===M?"selected":""}>${rotMes(i)}${ehAberto(i)?" · em aberto":DB.fechado[i]?"":" · sem dados"}</option>`).join("");
  // se veio link com estado, aplica antes do primeiro render
  sel.onchange=()=>{M=+sel.value;render();};
  const pi=document.getElementById("palin");
  if(pi) pi.oninput=e=>montaPal(e.target.value);
  const pl=document.getElementById("pal");
  if(pl) pl.onclick=e=>{ if(e.target===pl) fechaPal(); };
  const lado=document.querySelector(".side"), fundo=document.getElementById("drawerbg");
  const hm=document.getElementById("ham");
  const mqCel=window.matchMedia?matchMedia("(max-width:820px)"):null;
  // no celular, o menu fechado fica fora da ordem de foco
  window.ajustaMenu=()=>{ lado.inert=!!_modal||(!!(mqCel&&mqCel.matches)&&!lado.classList.contains("aberta")); };
  const abreMenu=v=>{ const eraAberto=lado.classList.contains("aberta");
    lado.classList.toggle("aberta",v); fundo.classList.toggle("on",v);
    if(hm) hm.setAttribute("aria-expanded",v?"true":"false"); ajustaMenu();
    if(v&&!eraAberto){ const f=lado.querySelector("button,select,[tabindex='0']"); if(f) f.focus(); }
    if(!v&&eraAberto&&hm&&mqCel&&mqCel.matches) hm.focus(); };
  window.menuAberto=()=>lado.classList.contains("aberta");
  if(hm){ hm.setAttribute("aria-expanded","false"); hm.setAttribute("aria-controls","menu-lateral"); }
  lado.id="menu-lateral";
  if(mqCel) (mqCel.addEventListener?mqCel.addEventListener("change",ajustaMenu):mqCel.addListener(ajustaMenu));
  ajustaMenu();
  if(hm) hm.onclick=()=>abreMenu(!lado.classList.contains("aberta"));
  if(fundo) fundo.onclick=()=>abreMenu(false);
  const tb=document.getElementById("tbbusca");
  if(tb) tb.onclick=()=>abrePal();
  // navegar fecha o menu no celular
  lado.addEventListener("click",e=>{ if(e.target.closest("a")) abreMenu(false); });
  window.fechaMenu=()=>abreMenu(false);
  const bg2=document.getElementById("bguia");
  if(bg2) bg2.onclick=()=>{ abreGuia(); if(window.fechaMenu) fechaMenu(); };
  const bp=document.getElementById("bpdf");
  if(bp) bp.onclick=()=>{ if(window.fechaMenu) fechaMenu(); setTimeout(()=>window.print(),120); };
  const gel=document.getElementById("guia");
  if(gel) gel.onclick=e=>{ if(e.target===gel) fechaGuia(); };
  const bt=document.getElementById("btema");
  const marcaTema=()=>{ if(bt){ const c=document.body.classList.contains("claro");
    bt.setAttribute("aria-label",c?"Mudar para o tema escuro":"Mudar para o tema claro"); bt.title=bt.getAttribute("aria-label"); } };
  if(bt) bt.onclick=()=>{ document.body.classList.toggle("claro");
    try{ localStorage.setItem("tema",document.body.classList.contains("claro")?"claro":"escuro"); }catch(e){}
    marcaTema(); render(); };                      // redesenha: cores de segmento vêm do tema
  // tema: a escolha salva; sem escolha (ou sem localStorage), segue o sistema operacional
  let temaSalvo=null; try{ temaSalvo=localStorage.getItem("tema"); }catch(e){}
  const sistemaClaro=!!(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches);
  if(temaSalvo==="claro"||(temaSalvo!=="escuro"&&sistemaClaro)) document.body.classList.add("claro");
  marcaTema();
  try{ leURL(); }catch(e){}
  try{ sincronizaBotoes(); }catch(e){}
  try{ carimbo(); }catch(e){}
  document.querySelectorAll("#modobar button").forEach(b=>b.onclick=()=>{
    modo=b.dataset.m; sincronizaBotoes(); render();});
  document.querySelectorAll("#cortebar button").forEach(b=>b.onclick=()=>{
    corte=+b.dataset.c; sincronizaBotoes(); render();});
  document.querySelectorAll("#perbar button").forEach(b=>b.onclick=()=>{
    periodo=b.dataset.p; sincronizaBotoes(); render();});
  render();
  window.__APP_PRONTO__=true;
  if(DB.carga&&(DB.carga.invalidos||DB.carga.curtas)) abreCarga();
})();
</script>
