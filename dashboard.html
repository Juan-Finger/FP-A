<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise de Variação — FP&A</title>
<!-- Arquivo 100% offline: a CSP abaixo proíbe qualquer conexão de rede (fetch, XHR,
     beacon, imagens, fontes e folhas de estilo externas). Não remover. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<style>
:root{
  --bg:#080F1C; --s1:#0D1829; --s2:#132135; --s3:#1A2B42;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --cy:#22D3EE; --cy2:#67E8F9;
  --red:#F26D6D; --amb:#EFB25C; --grn:#4ADE9B;
  --tx:#E8EEF5; --mut:#8FA3B8; --dim:#5D7188;
  --alf:#3B9BC9; --cd:#9B6BC4; --tra:#14B8A6; --fro:#E0628A; --cor:#E0A458; --bko:#7C8DA6;
  --r:10px;
  --fs:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --fm:ui-monospace,'Cascadia Mono','Segoe UI Mono',Consolas,'SF Mono',Menlo,monospace;
}
body.claro{
  --bg:#F4F6F9; --s1:#FFFFFF; --s2:#EDF1F6; --s3:#DCE3EC;
  --line:rgba(12,35,64,.10); --line2:rgba(12,35,64,.20);
  --cy:#0E7C94; --cy2:#0B6076;
  --red:#C0392B; --amb:#9A6608; --grn:#1E7D5A;
  --tx:#132030; --mut:#4E6076; --dim:#7A8A9C;
  --alf:#2E86AB; --cd:#7A5195; --tra:#0E8C7F; --fro:#C04268; --cor:#B07B25; --bko:#5D7188;
}
body.claro .side{background:#FFFFFF}
body.claro .kpi,body.claro .card,body.claro .worst,body.claro .tw,body.claro .expl{
  box-shadow:0 1px 2px rgba(12,35,64,.06)}
body.claro thead th{background:#0C2340;color:#DCE7F2}
body.claro .segbar button.on,body.claro .chip.on,body.claro .vbar2 button.on{
  background:#0C2340;color:#fff}
body.claro .tip{background:#132030;color:#EAF0F7}
body.claro td.hm{color:#2A1D06}
body.claro .brand .bar{background:#0E7C94}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fs);background:var(--bg);color:var(--tx);
     -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;
     letter-spacing:-.02em}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--s1);border-right:1px solid var(--line);padding:20px 0 0;
      display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
      overflow:hidden}
.sidescroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.sidescroll::-webkit-scrollbar{width:6px}
.brand{display:flex;gap:11px;align-items:flex-start;padding:0 18px 20px}
.brand .bar{width:3px;height:34px;background:var(--cy);border-radius:2px;flex:none}
.brand .t{font-size:14px;font-weight:500;line-height:1.2}
.brand .s{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.04em}

.navlbl{font-size:9.5px;color:var(--dim);letter-spacing:.11em;text-transform:uppercase;
        padding:14px 18px 7px;display:flex;align-items:center}
.tema{margin-left:auto;background:transparent;border:none;color:var(--dim);cursor:pointer;
  font-size:14px;line-height:1;padding:0 2px}
.tema:hover{color:var(--cy)}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 10px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
       font-size:12.5px;color:var(--mut);cursor:pointer;transition:background .13s,color .13s;
       border:1px solid transparent}
.nav a:hover{background:var(--s2);color:var(--tx)}
.nav a.on{background:var(--s2);color:var(--tx);border-color:var(--line2)}
.nav a .dot{width:6px;height:6px;border-radius:50%;flex:none}
.nav a .n{margin-left:auto;font-size:11px;color:var(--dim)}
.nav a.on .n,.nav a:hover .n{color:var(--red)}

.sidefoot{flex:none;padding:12px 18px 16px;border-top:1px solid var(--line);
  background:var(--s1)}
.mlbl{font-size:9.5px;color:var(--dim);letter-spacing:.11em;text-transform:uppercase;margin-bottom:6px}
select#mes{width:100%;background:var(--s2);border:1px solid var(--line2);color:var(--cy);
  font-family:inherit;font-size:15px;font-weight:500;padding:7px 10px;border-radius:7px;
  cursor:pointer;outline:none}
select#mes option{background:var(--s2);color:var(--tx)}
.mstatus{font-size:10.5px;margin-top:7px;display:flex;align-items:center;gap:5px;color:var(--dim)}
.mstatus .pip{width:5px;height:5px;border-radius:50%;background:var(--grn)}
.mstatus.open .pip{background:var(--amb)} .mstatus.open{color:var(--amb)}

.main{padding:26px 32px 60px;max-width:1760px;min-width:0}
.crumb{font-size:11.5px;color:var(--dim);margin-bottom:5px;display:flex;gap:6px;align-items:center}
.crumb span{cursor:pointer} .crumb span:hover{color:var(--cy2)}
.crumb i{color:var(--s3)}
.h1{font-size:24px;font-weight:500;letter-spacing:-.015em}
.h1sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
     position:relative;overflow:hidden}
.kpi .lbl{font-size:10px;color:var(--dim);letter-spacing:.07em;text-transform:uppercase}
.kpi .v{font-size:27px;font-weight:500;margin-top:6px;letter-spacing:-.03em}
.kpi .sub{font-size:11px;color:var(--dim);margin-top:2px}
.kpi.r .v{color:var(--red)} .kpi.a .v{color:var(--amb)} .kpi.g .v{color:var(--grn)}
.kpi.c .v{color:var(--cy)}

.sect{font-size:10.5px;color:var(--dim);letter-spacing:.11em;text-transform:uppercase;
      margin:0 0 12px;display:flex;align-items:center;gap:10px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- cards ---------- */
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
      cursor:pointer;transition:border-color .15s,background .15s,transform .15s;position:relative}
.card:hover{border-color:var(--line2);background:var(--s2);transform:translateY(-1px)}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .nm{font-size:14px;font-weight:500;line-height:1.25}
.card .tag{font-size:9.5px;padding:2px 7px;border-radius:5px;flex:none;letter-spacing:.03em}
.card .mid{display:flex;align-items:flex-end;gap:14px;margin-top:14px}
.card .big{font-size:30px;font-weight:500;line-height:1.05;letter-spacing:-.035em;color:var(--red);white-space:nowrap}
.card .big.z{color:var(--grn)}
.card .biglbl{font-size:10.5px;color:var(--dim);line-height:1.25;padding-bottom:2px;white-space:nowrap}
.card .spark{margin-left:auto;opacity:.85}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:13px;
     padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);white-space:nowrap}
.card.calm{opacity:.55} .card.calm:hover{opacity:1}
.pos{color:var(--grn)} .neg{color:var(--red)}

/* barra de proporção */
.pbar{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;margin-top:11px}
.pbar i{display:block;height:100%;background:var(--red);border-radius:2px;transition:width .3s}

/* ---------- tabela ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:5px 13px;
      font-size:11.5px;color:var(--mut);cursor:pointer;transition:all .13s;white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--tx)}
.chip.on{background:var(--cy);border-color:var(--cy);color:#06202B;font-weight:500}
.chip .c{opacity:.65;margin-left:3px}
input#busca{flex:1;min-width:170px;background:var(--s1);border:1px solid var(--line);
  border-radius:20px;padding:6px 14px;color:var(--tx);font-family:inherit;font-size:12px;outline:none}
input#busca:focus{border-color:var(--cy)}
input#busca::placeholder{color:var(--dim)}

.tw{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);
  overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch}
.tw table{min-width:860px}
.tw.mapa table{min-width:640px}
/* barra de rolagem visível: sem ela ninguém descobre que a tabela corre */
.tw::-webkit-scrollbar{height:10px}
.tw::-webkit-scrollbar-track{background:var(--s2);border-radius:0 0 var(--r) var(--r)}
.tw::-webkit-scrollbar-thumb{background:var(--s3);border-radius:6px;border:2px solid var(--s2)}
.tw::-webkit-scrollbar-thumb:hover{background:var(--line2)}
/* sombra na borda direita indicando que há mais colunas */
.tw{background-image:linear-gradient(to right,transparent calc(100% - 26px),rgba(0,0,0,.28));
  background-repeat:no-repeat;background-attachment:local,scroll}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{background:var(--s2);color:var(--mut);text-align:left;padding:10px 12px;font-weight:500;
  font-size:11px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;
  border-bottom:1px solid var(--line);user-select:none;position:sticky;top:0;z-index:2}
thead th:hover{color:var(--tx)}
thead th .ar{color:var(--cy);margin-left:3px;font-size:9px}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--s2)}
td.r{text-align:right}
.st{font-size:10px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap;
    display:inline-block}
.st.sem{background:rgba(242,109,109,.13);color:#F79A9A}
.st.ana{background:rgba(239,178,92,.13);color:#F3C784}
.st.sorc{background:rgba(167,139,250,.15);color:#C4B5FD}
.st.ok{background:rgba(74,222,155,.13);color:#7BE8BB}
.st.zer{background:rgba(143,163,184,.10);color:var(--mut)}
.st.abr{background:rgba(34,211,238,.11);color:var(--cy2)}
.cls{color:var(--dim);font-size:11px}
.empty{padding:44px;text-align:center;color:var(--dim);font-size:13px}
.vbar{display:inline-block;height:4px;border-radius:2px;vertical-align:middle;margin-left:7px}

/* lista de piores (hub) */
.worst{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid var(--line);
      cursor:pointer;transition:background .13s}
.wrow:last-child{border-bottom:none}
.wrow:hover{background:var(--s2)}
.wrow .rk{font-size:11px;color:var(--dim);width:16px;flex:none}
.wrow .nm{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .sg{font-size:9.5px;padding:2px 7px;border-radius:5px;flex:none}
.wrow .qt{font-size:13.5px;font-weight:500;color:var(--red);width:78px;text-align:right;flex:none;white-space:nowrap}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
}
.xbtn{background:var(--s2);border:1px solid var(--line2);color:var(--mut);
  font-family:inherit;font-size:10.5px;letter-spacing:.03em;padding:4px 11px;border-radius:14px;
  cursor:pointer;transition:all .13s;text-transform:none}
.xbtn:hover{background:var(--cy);border-color:var(--cy);color:#06202B}
.fv{font-size:9.5px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.fv.fav{background:rgba(74,222,155,.13);color:#7BE8BB}
.fv.desf{background:rgba(242,109,109,.13);color:#F79A9A}
.fv.neutro{background:rgba(143,163,184,.10);color:var(--dim)}
.nat{font-size:9.5px;color:var(--dim)}
.legenda{font-size:11px;color:var(--dim);margin:-6px 0 14px;display:flex;gap:16px;flex-wrap:wrap}
.legenda b{font-weight:400;color:var(--mut)}
.cf{font-size:9.5px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.cf.alta{background:rgba(242,109,109,.14);color:#F79A9A}
.cf.media{background:rgba(239,178,92,.13);color:#F3C784}
.cf.baixa,.cf.nd{background:rgba(143,163,184,.10);color:var(--dim)}
.expl{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.erow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12px}
.erow .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .bb{height:5px;border-radius:3px;flex:none}
.gerado{font-size:10px;color:var(--dim);margin-top:9px;padding-top:9px;
  border-top:1px solid var(--line);line-height:1.45}
.gerado b{color:var(--mut);font-weight:400}
.gerado.velho{color:var(--amb)}
.gerado.velho b{color:var(--amb)}
.lnk{background:none;border:none;padding:0;margin-top:5px;color:var(--cy2);font:inherit;text-decoration:underline;cursor:pointer}
.lnk.av{color:var(--amb)}
.segbar{display:flex;gap:3px;background:var(--s2);border:1px solid var(--line);
  border-radius:8px;padding:3px;margin:0 10px 4px}
.segbar button{flex:1;background:transparent;border:none;color:var(--mut);font-family:inherit;
  font-size:11.5px;padding:5px 6px;border-radius:6px;cursor:pointer;transition:all .13s;white-space:nowrap}
.segbar button:hover{color:var(--tx)}
.segbar button.on{background:var(--cy);color:#06202B;font-weight:500}
.segbar.sm{margin:0}
.segbar.sm button{font-size:11px;padding:4px 3px}
.modotag{font-size:10px;padding:2px 8px;border-radius:5px;background:rgba(34,211,238,.13);
  color:var(--cy2);margin-left:8px;vertical-align:2px}
.acoes{display:flex;gap:6px;margin-top:10px}
.bt2{flex:1;background:var(--s2);border:1px solid var(--line2);color:var(--mut);
  font-family:inherit;font-size:11px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:all .13s}
.bt2:hover{background:var(--cy);border-color:var(--cy);color:#06202B}
.guia{position:fixed;inset:0;background:rgba(4,10,20,.76);z-index:210;display:none;
  align-items:flex-start;justify-content:center;padding:7vh 16px;overflow-y:auto}
.guia.on{display:flex}
.guiabox{width:min(680px,100%);background:var(--s1);border:1px solid var(--line2);
  border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.guiah{display:flex;align-items:flex-start;gap:12px;padding:17px 20px 14px;
  border-bottom:1px solid var(--line)}
.guiah .gt{font-size:17px;font-weight:500}
.guiah .gs{font-size:12px;color:var(--mut);margin-top:3px}
.gx{margin-left:auto;background:transparent;border:none;color:var(--dim);font-size:15px;
  cursor:pointer;padding:2px 6px}
.gx:hover{color:var(--tx)}
.guial{padding:6px 20px 14px;max-height:62vh;overflow-y:auto}
.gp{padding:13px 0;border-bottom:1px solid var(--line)}
.gp:last-child{border-bottom:none}
.gpt{font-size:13.5px;font-weight:500;color:var(--cy2)}
.gpd{font-size:12.5px;color:var(--mut);margin-top:5px;line-height:1.55}
.gpd b{color:var(--tx);font-weight:500}
.gpb{margin-top:9px;background:var(--s2);border:1px solid var(--line2);color:var(--tx);
  font-family:inherit;font-size:11.5px;padding:5px 12px;border-radius:16px;cursor:pointer}
.gpb:hover{background:var(--cy);border-color:var(--cy);color:#06202B}
.guiaf{padding:11px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.guiaf kbd{background:var(--s2);border:1px solid var(--line2);border-radius:4px;
  padding:0 4px;font-family:inherit;font-size:10px}
.pal{position:fixed;inset:0;background:rgba(4,10,20,.72);z-index:200;display:none;
  align-items:flex-start;justify-content:center;padding:11vh 20px 20px;backdrop-filter:blur(2px)}
.pal.on{display:flex}
.palbox{width:min(720px,94vw);background:var(--s1);border:1px solid var(--line2);
  border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55)}
#palin{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--tx);font-family:inherit;font-size:15px;padding:15px 20px;outline:none}
#palin::placeholder{color:var(--dim)}
.pallist{max-height:46vh;overflow:auto}
.palit{display:flex;align-items:center;gap:11px;padding:9px 20px;cursor:pointer;font-size:13px}
.palit.sel{background:var(--s2)}
.palit .pt{font-size:9.5px;color:var(--dim);background:var(--s2);border-radius:4px;
  padding:1px 7px;flex:none;min-width:74px;text-align:center}
.palit.sel .pt{background:var(--s3)}
.palit .pn2{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;overflow:hidden}
.palit .pnn{flex:1.15 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palit .psub{flex:1 1 0;min-width:0;color:var(--mut);font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.palit .psub::before{content:"—";color:var(--s3);margin-right:6px}
.palit .pnota{flex:none;color:var(--dim);font-size:11px;font-style:italic;white-space:nowrap}
.palit.inerte{opacity:.55;cursor:default}
#palcab{border-bottom:1px solid var(--line);background:var(--s2)}
.palcab{display:flex;align-items:center;gap:9px;padding:7px 18px;font-size:11px;color:var(--mut)}
.palcab b{color:var(--cy2);font-weight:500}
.palbt{margin-left:auto;background:var(--s1);border:1px solid var(--line2);color:var(--mut);
  font-family:inherit;font-size:10.5px;padding:3px 10px;border-radius:12px;cursor:pointer;white-space:nowrap}
.palbt:hover{background:var(--cy);border-color:var(--cy);color:#06202B}
.palit .px{font-size:10.5px;color:var(--dim)}
.palvazio{padding:24px;text-align:center;color:var(--dim);font-size:13px}
.palfoot{font-size:10.5px;color:var(--dim);padding:8px 20px;border-top:1px solid var(--line)}
.dicak{font-size:10px;color:var(--dim);padding:6px 18px 0}
.dicak kbd{background:var(--s2);border:1px solid var(--line2);border-radius:4px;
  padding:0 4px;font-family:inherit;font-size:9.5px}
@media print{
  body{background:#fff;color:#000}
  .side,.pal,.tip,.guia,.topbar,.xbtn,.vbar2,.segbar,.chip,.abas{display:none!important}
  .app{grid-template-columns:1fr}
  .main{padding:0}
  .kpi,.card,.tw,.expl,.worst,.faixar,.exbox,.expbox,.par{break-inside:avoid;
    border:1px solid #ccc!important;background:#fff!important;box-shadow:none!important}
  .kpi .v,.card .big,.h1,.frv,.rres{color:#000!important}
  .frl,.frd,.lbl,.sub,.nat,.cls,.expl2{color:#555!important}
  .fr{border-left:1px solid #ddd!important}
  .fr:first-child{border-left:none!important}
  .pos{color:#0a6b48!important} .neg{color:#a32318!important}
  .st,.cf,.fv,.tp,.pad,.tag,.sg{border:1px solid #ccc!important;background:#f5f5f5!important;
    color:#333!important}
  .hpb,.bar2 i,.bb,.gb,.pbar i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td.hm{-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#222!important}
  .main{padding:0}
  @page{margin:12mm}
  thead th{background:#eee!important;color:#000!important}
  td,th{color:#000!important}
  a{text-decoration:none}
}
.tip{position:fixed;z-index:99;max-width:390px;background:#0A1420;border:1px solid var(--line2);
  border-radius:9px;padding:11px 13px;font-size:12px;line-height:1.5;color:var(--tx);
  box-shadow:0 10px 34px rgba(0,0,0,.6);pointer-events:none;animation:f .12s ease}
.tip b{font-weight:500}
.tip.fixo{max-width:360px;pointer-events:auto}

/* ==== Constantes portadas de gerar_dashboard.py ==== */
const _VIG=new Set(["4801A","4419A","5106A","4402A","5110A","5003A","5103A"]);
const _UNIFICAR={"4417A":"4418A","5002A":"5001A"};
const _COD_EQUIV={"4001A":"4103A"};
const _SEG_MANUAL={"4402A":"CDs","4425A":"Fronteiras","5003A":"Transportes"};
const _FUNDIR={"4.1.1.01.1.98":"4.1.1.01.1.99"};
const _REC_EXTRA=new Set(["4.1.1.02.1.09"]);
const _MESES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

function _limpa(v){let t=(v||"").trim();const m=t.match(/^="?([\s\S]*?)"?$/);if(m)t=m[1];return t.replace(/^"+|"+$/g,'').trim();}
// Número pt-BR ("1.234,56"). A conversão é a mesma do gerador Python (tira os
// pontos, vírgula vira ponto, o texto inteiro tem de ser número; senão vale 0).
// Todo valor fora do formato pt-BR é registrado e aparece no resumo da carga,
// inclusive os que convertem mas são suspeitos (ex.: "1234.56" vira 123456).
const _RE_NUM=/^-?(?:\d{1,3}(?:\.\d{3})+|\d*)(?:,\d*)?$/;
function _num(v,inv,li,col){
  let t=v||"";
  t=(t.charCodeAt(0)===61||t.indexOf('"')>=0)?_limpa(t):t.trim();   // ="..." só quando precisa
  if(t==="") return 0;
  let n=Number(t.replace(/\./g,'').replace(/,/g,'.'));
  const valido=Number.isFinite(n);
  if(!valido) n=0;
  if(inv&&(!valido||!_RE_NUM.test(t))) inv(t,li,col);
  return Math.round(n*100)/100;
}
function _cel(l,i){return (i>=0&&i<l.length)?l[i]:"";}
function _seg(cod){
  if(["6","7","8","9"].includes(cod[0])) return "Backoffice";
  const k=_COD_EQUIV[cod]||cod;
  if(SEGMAP[k]) return SEGMAP[k];
  return _SEG_MANUAL[cod]||"Sem segmento";
}
function _compacta(v){const r=Math.round(v*100)/100;const i=Math.trunc(r);return r===i?i:r;}

/* Parser CSV com a mesma semântica do csv.reader do Python (delimitador ';'):
   aspa só abre campo quoted quando é o 1º caractere do campo; "" dentro dele é
   uma aspa; aspa no meio de um campo comum é literal. Entrega uma linha por vez
   (não guarda o arquivo inteiro em memória). Processa a partir de `ini` e para
   depois de `max` linhas, sempre numa fronteira de linha; devolve onde parou. */
function _parseCSV(txt,onRow,ini=0,max=Infinity){
  const n=txt.length; let i=ini,row=[],k=0;
  const fim=j=>{while(j<n){const c=txt.charCodeAt(j);if(c===59||c===10||c===13)break;j++;}return j;};
  while(i<n){ let f;
    if(txt.charCodeAt(i)===34){ let j=i+1; f="";
      for(;;){const q=txt.indexOf('"',j); if(q<0){f+=txt.slice(j);i=n;break;}
        f+=txt.slice(j,q); if(txt.charCodeAt(q+1)===34){f+='"';j=q+2;} else {i=q+1;break;}}
      const e=fim(i); f+=txt.slice(i,e); i=e;
    } else { const e=fim(i); f=txt.slice(i,e); i=e; }
    row.push(f); const c=txt.charCodeAt(i);
    if(c===59){ i++; if(i===n){row.push("");onRow(row);} continue; }
    if(c===13){ i++; if(txt.charCodeAt(i)===10) i++; } else if(c===10) i++;
    onRow(row); row=[];
    if(++k>=max) return i;
  }
  return n;
}

/* Conferência do cabeçalho: só recusa CONTRADIÇÕES (ex.: "Realizado" onde deveria
   estar o Planejado, ou "MAR" na coluna de fevereiro). Cabeçalho sem rótulo
   reconhecível passa, com uma nota no resumo da carga. */
const _MESN=[["jan","janeiro"],["fev","fevereiro"],["mar","marco"],["abr","abril"],["mai","maio"],["jun","junho"],
             ["jul","julho"],["ago","agosto"],["set","setembro"],["out","outubro"],["nov","novembro"],["dez","dezembro"]];
const _norm=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function _confereCabecalho(h){
  const erros=[]; let reconhecidas=0;
  for(let i=0;i<12;i++) for(const [col,tipo] of [[_PLAN[i],"Planejado"],[_REAL[i],"Realizado"]]){
    const bruto=_limpa(_cel(h,col)), t=_norm(bruto);
    const real=/real/.test(t), plan=/plan|orc|previs|budget/.test(t);
    const meses=_MESN.map((ns,m)=>ns.some(x=>new RegExp("(^|[^a-z])"+x+"([^a-z]|$)").test(t))?m:-1).filter(m=>m>=0);
    if(real||plan||meses.length) reconhecidas++;
    if(tipo==="Planejado"&&real&&!plan || tipo==="Realizado"&&plan&&!real)
      erros.push(`coluna ${col+1} ("${bruto}") deveria ser ${tipo} de ${_MESES[i]}`);
    else if(meses.length&&!meses.includes(i))
      erros.push(`coluna ${col+1} ("${bruto}") parece ser de ${_MESES[meses[0]]}, mas deveria ser ${tipo} de ${_MESES[i]}`);
  }
  return {erros, nota: reconhecidas ? "" : "O cabeçalho não tem rótulos de mês/Planejado/Realizado reconhecíveis; a posição das colunas não pôde ser conferida."};
}

/* Agregação conta × unidade. Regras de negócio idênticas ao gerador Python. */
function _agregador(info){
  const comb=new Map(), unit_desc=new Map(), acct_desc=new Map();
  const carga={arquivo:(info&&info.nome)||"",tamanho:(info&&info.tamanho)||0,modificado:(info&&info.modificado)||0,
    encoding:(info&&info.encoding)||"",linhas:0,usadas:0,vazias:0,naoA:0,dummy:0,semConta:0,curtas:0,
    invalidos:0,amostrasInv:[],cabecalho:{erros:[],nota:""}};
  let hdr=null, li=0;
  function linha(l){
    li++;
    if(!hdr){
      hdr=l;
      if(hdr.length<_COLMIN) throw new Error("O arquivo tem "+hdr.length+" colunas; o esperado são ao menos "+_COLMIN+". Confirme que é o export do Plano com Planejado e Realizado de janeiro a dezembro.");
      carga.cabecalho=_confereCabecalho(hdr);
      if(carga.cabecalho.erros.length) throw new Error("As colunas do arquivo não estão na ordem esperada: "
        +carga.cabecalho.erros.slice(0,3).join("; ")+(carga.cabecalho.erros.length>3?" …":"")
        +". Confirme que é o export padrão do Plano.");
      return;
    }
    carga.linhas++;
    if(!l||l.length===0||(l.length===1&&l[0]==="")){carga.vazias++;return;}
    const uo=_limpa(_cel(l,_CU));
    if(uo==="DUMMYA"){carga.dummy++;return;}
    if(!uo.endsWith("A")){carga.naoA++;return;}
    const u=_UNIFICAR[uo]||uo;
    let c=_limpa(_cel(l,_CC)); if(!c){carga.semConta++;return;}
    c=_FUNDIR[c]||c;
    if(l.length<_COLMIN) carga.curtas++;
    carga.usadas++;
    if(!unit_desc.has(u)||uo===u) unit_desc.set(u,_limpa(_cel(l,_CUD)));
    if(!acct_desc.has(c)) acct_desc.set(c,_limpa(_cel(l,_CCD)));
    const k=c+"\u0000"+u;
    let o=comb.get(k); if(!o){o=[new Array(12).fill(0),new Array(12).fill(0)];comb.set(k,o);}
    for(let i=0;i<12;i++){
      o[0][i]+=_num(_cel(l,_PLAN[i]),inv,li,_PLAN[i]);
      o[1][i]+=_num(_cel(l,_REAL[i]),inv,li,_REAL[i]);
    }
  }
  function inv(t,linha,col){carga.invalidos++;
    if(carga.amostrasInv.length<12) carga.amostrasInv.push({linha,coluna:col+1,valor:t});}
  function fim(){
    if(!hdr||carga.linhas===0) throw new Error("O arquivo não tem linhas de dados.");
    if(comb.size===0) throw new Error("Nenhuma linha aproveitável. Só entram unidades da família analítica (código terminado em 'A').");
    const data=[];
    for(const [k,o] of comb){
      const idx=k.indexOf("\u0000"), c=k.slice(0,idx), u=k.slice(idx+1);
      const tem=o[0].some(x=>Math.abs(x)>0.005)||o[1].some(x=>Math.abs(x)>0.005);
      if(tem) data.push({a:c,u:u,p:o[0].map(_compacta),r:o[1].map(_compacta)});
    }
    const units=[...unit_desc.keys()].sort().map(u=>({cod:u,nome:unit_desc.get(u)||u,seg:_VIG.has(u)?"Vigiada":_seg(u),vig:_VIG.has(u)?1:0}));
    const ehRec=c=>{if(_REC_EXTRA.has(c))return true;return String((CLASSIF[c]||["",""])[0]).toLowerCase().startsWith("recorrente");};
    const nat=c=>{const pre=c.split(".")[0],sub=c.slice(0,3);
      if(pre==="3"){const ded=c.slice(0,5)==="3.1.1"&&(acct_desc.get(c)||"").includes("(-)");return ded?"ded":"rec";}
      if(pre==="4"){if(sub==="4.2")return "out";if(sub==="4.3")return "fin";return "cd";}
      if(pre==="5")return "imp";return "out";};
    const accts=[...acct_desc.keys()].sort().map(c=>({cod:c,desc:acct_desc.get(c),nat:nat(c),rec:(CLASSIF[c]||["—","—"])[0],fv:(CLASSIF[c]||["—","—"])[1],r:ehRec(c)?1:0}));
    const mes_abs=new Array(12).fill(0);
    for(const d of data) for(let i=0;i<12;i++) mes_abs[i]+=Math.abs(d.r[i]);
    const fechado=mes_abs.map(x=>Math.abs(x)>1);
    // conferência: totais por mês (todas as unidades "A", inclusive vigiadas)
    carga.totais=_MESES.map((m,i)=>{let p=0,r=0;for(const d of data){p+=d.p[i];r+=d.r[i];}return {p,r};});
    carga.semSegmento=units.filter(u=>u.seg==="Sem segmento").map(u=>u.cod+" "+u.nome);
    carga.semClassif=accts.filter(a=>!CLASSIF[a.cod]&&!["rec","ded"].includes(a.nat)).map(a=>a.cod+" "+a.desc);
    const d=new Date(),z=n=>String(n).padStart(2,"0");
    const gerado=d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"T"+z(d.getHours())+":"+z(d.getMinutes());
    return {meses:_MESES,fechado,units,accts,data,gerado,carga};
  }
  return {linha,fim};
}
// Versão síncrona (usada pelos testes). A tela de carga usa a assíncrona.
function construirPayload(txt,info){
  const ag=_agregador(info); _parseCSV(txt,ag.linha); return ag.fim();
}
// Processa em blocos para a tela não congelar e mostrar o progresso.
async function construirPayloadAsync(txt,info,progresso){
  const ag=_agregador(info); let i=0;
  while(i<txt.length){
    i=_parseCSV(txt,ag.linha,i,4000);
    if(progresso) progresso(i/txt.length);
    await new Promise(r=>setTimeout(r,0));
  }
  return ag.fim();
}
// UTF-8 quando o arquivo é UTF-8 válido (ex.: regravado pelo Excel); senão Windows-1252,
// que é o padrão do export do Plano.
function _decodifica(buf){
  try{ return {txt:new TextDecoder("utf-8",{fatal:true}).decode(buf),encoding:"UTF-8"}; }
  catch(e){ return {txt:new TextDecoder("windows-1252").decode(buf),encoding:"Windows-1252"}; }
}

  var ocupado=false;
  function msg(t,cor){var m=document.getElementById("_msg");if(!m)return;m.textContent="";
    if(t){var s=document.createElement("span");s.style.color=cor||"#F87171";s.textContent=t;m.appendChild(s);}}
  // Enquanto a tela de carga está aberta, o painel por trás não recebe foco nem clique.
  function inerte(v){document.querySelectorAll("body > *").forEach(function(el){if(el.id!=="_ov")el.inert=v;});}
  function arranca(pay){
    window.__DB__=pay;
    var erro=null, antes=window.onerror;
    window.onerror=function(m){erro=m;return true;};
    var code=document.getElementById("app").textContent+"\n;window.__APP_OK__=true;";
    var s=document.createElement("script");s.textContent=code;document.body.appendChild(s);
    window.onerror=antes;
    if(!window.__APP_OK__){ msg("O painel não conseguiu iniciar com esta base: "+(erro||"erro desconhecido")+". Recarregue a página (F5) e tente de novo."); return; }
    var ov=document.getElementById("_ov");if(ov)ov.remove();
    inerte(false);
    if(window.__aoCarregar__) window.__aoCarregar__();
  }
  function processar(file){
    if(!file||ocupado)return;
    ocupado=true;
    if(!/\.csv$/i.test(file.name)) msg("Isso não parece um .csv, mas vou tentar mesmo assim…","#E7B549");
    else msg("Lendo "+file.name+"…","#8FA3B8");
    var rd=new FileReader();
    rd.onload=function(){
      var dec=_decodifica(rd.result);
      var info={nome:file.name,tamanho:file.size,modificado:file.lastModified||0,encoding:dec.encoding};
      construirPayloadAsync(dec.txt,info,function(f){msg("Processando "+file.name+"… "+Math.round(f*100)+"%","#8FA3B8");})
        .then(arranca)
        .catch(function(e){msg("Não deu para montar o painel: "+e.message);})
        .then(function(){ocupado=false;});
    };
    rd.onerror=function(){msg("Não consegui ler o arquivo.");ocupado=false;};
    rd.readAsArrayBuffer(file);
  }
  function wire(){
    var inp=document.getElementById("_file"),zone=document.getElementById("_zone");
    inp.addEventListener("change",function(e){processar(e.target.files[0]);e.target.value="";});

    window.addEventListener("dragover",function(e){e.preventDefault();});
    window.addEventListener("drop",function(e){e.preventDefault();zone.style.borderColor="";zone.style.background="";
      if(document.getElementById("_ov")&&e.dataTransfer&&e.dataTransfer.files.length) processar(e.dataTransfer.files[0]);});
    inp.focus();
  }
  function show(){var d=document.createElement("div");d.innerHTML=OV;while(d.firstChild)document.body.appendChild(d.firstChild);inerte(true);wire();}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",show);else show();
})();

<script id="app" type="text/plain">
const DB = window.__DB__;

// Se alguém abrir o template direto (sem gerar), DB vem nulo.
if(!DB){
  document.body.innerHTML=`<div style="max-width:560px;margin:14vh auto;padding:26px 30px;
    background:#0D1829;border:1px solid rgba(255,255,255,.13);border-radius:12px;

    <div style="display:flex;gap:13px;align-items:flex-start">
      <div style="width:4px;align-self:stretch;background:#22D3EE;border-radius:2px"></div>
      <div>
        <div style="font-size:19px;font-weight:500">Este é o modelo, não o painel</div>
        <p style="color:#8FA3B8;font-size:13.5px;margin-top:9px">
          O arquivo <b style="color:#E8EEF5">template.html</b> é o código-fonte do painel: ele não
          contém dados. Abrir direto não funciona.</p>
        <p style="color:#8FA3B8;font-size:13.5px;margin-top:9px">
          Para ver o painel, abra o <b style="color:#E8EEF5">dashboard.html</b>. Se ele ainda não
          existe, gere com:</p>
        <pre style="background:#132135;padding:11px 13px;border-radius:8px;font-size:12.5px;
          color:#67E8F9;margin-top:9px;overflow-x:auto">python gerar_dashboard.py</pre>
        <p style="color:#5D7188;font-size:12px;margin-top:11px">
          O gerador lê as bases da pasta e substitui os dados aqui dentro.</p>
      </div></div></div>`;
  throw new Error("template aberto sem dados");
}


// Escapa texto vindo do CSV antes de pôr em HTML (nomes e descrições são dados, não markup).
const he=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
// Valor para dentro de um onclick="...": string JS válida e escapada para o atributo.
const js=s=>he(JSON.stringify(String(s??"")));

const SEG=["Alfandegados","CDs","Transportes","Fronteiras","Corporativo","Backoffice","Sem segmento"];
const SEGNM={Alfandegados:"Alfandegados",CDs:"CDs",Transportes:"Transportes",Fronteiras:"Fronteiras",Corporativo:"Corporativo",Backoffice:"Backoffice",Vigiada:"Vigiada","Sem segmento":"Sem segmento"};
const SEGVAR={Alfandegados:"--alf",CDs:"--cd",Transportes:"--tra",Fronteiras:"--fro",Corporativo:"--cor",Backoffice:"--bko","Sem segmento":"--dim"};
const cor=s=>getComputedStyle(document.documentElement).getPropertyValue(SEGVAR[s]||"--dim").trim();
const tint=(s,a)=>{const h=cor(s);return `background:${h}1F;color:${h}`;};

let M = DB.fechado.lastIndexOf(true); if(M<0) M=0;
let modo="geral";      // "geral" | "rec"
let vseg="un";
let expConta=null;   // visão do segmento: "un" unidades | "ct" contas
let corte=0;           // materialidade: ignora contas abaixo deste valor
let periodo="mes";     // "mes" | "acum" | "sem"
const recSet=new Set(DB.accts.filter(a=>a.r).map(a=>a.cod));
const EPS=0.005;   // meio centavo: abaixo disso o valor é zero
const natMap=Object.fromEntries(DB.accts.map(a=>[a.cod,a.nat]));
// Receita e deduções não entram na conta de pendência: não faturar não é
// falha de lançamento. Elas alimentam a visão de resultado.
const ehResultado=c=>["rec","ded"].includes(natMap[c]);
const ehPendencia=c=>!ehResultado(c);
const UNS_VIG=DB.units.filter(u=>u.vig).map(u=>u.cod);
const VIG=new Set(UNS_VIG);
const NATLBL={rec:"Receita",ded:"Dedução",cd:"Custo/Despesa",out:"Outras rec./desp.",
              fin:"Result. financeiro",imp:"Impostos"};
const ehRec=c=>recSet.has(c);
const N_REC=recSet.size;

// meses cobertos pela comparação escolhida
function faixa(){
  if(periodo==="acum") return [0,M];
  if(periodo==="sem")  return M<6?[0,5]:[6,11];
  return [M,M];
}
function mesesAtivos(){                     // só meses já fechados dentro da faixa
  const [a,b]=faixa(), out=[];
  for(let i=a;i<=b;i++) if(DB.fechado[i]) out.push(i);
  return out;
}
function faixaLbl(){
  const ms=mesesAtivos();
  if(!ms.length) return DB.meses[M]+"/26";
  if(periodo==="mes") return DB.meses[M]+"/26";
  return DB.meses[ms[0]]+"–"+DB.meses[ms[ms.length-1]]+"/26";
}
const rotMes=i=>DB.meses[i]+"/26";
const PERLBL={mes:"mês",acum:"acumulado",sem:"semestre"};

// Um mês "fechado" pode estar só parcialmente lançado. Detecta comparando o
// volume de lançamentos com a mediana dos demais meses fechados.
const PARCIAL=(()=>{
  const fech=[...Array(12).keys()].filter(i=>DB.fechado[i]);
  const tot=fech.map(i=>DB.data.filter(d=>Math.abs(d.r[i])>EPS).length);
  const ord=[...tot].sort((a,b)=>a-b);
  const med=ord.length?(ord.length%2?ord[(ord.length-1)/2]:(ord[ord.length/2-1]+ord[ord.length/2])/2):0;
  const set=new Set();
  fech.forEach((i,k)=>{ if(med>0 && tot[k]<med*0.7) set.add(i); });
  return {set,med,tot:Object.fromEntries(fech.map((i,k)=>[i,tot[k]]))};
})();
const ehParcial=i=>PARCIAL.set.has(i);
const MODOLBL={geral:"Plano geral",rec:"Contas recorrentes"};
let view={tipo:"hub",seg:null,unit:null,filtro:"todos",busca:"",sk:"st",sd:1};

const fmtN=n=>Math.round(n).toLocaleString("pt-BR");
const pct=(n,d=1)=>n.toFixed(d).replace(".",",")+"%";
// Valores com centavos, para fechar exatamente com o plano.
const fmtC=n=>(n<0?"−":"")+Math.abs(n).toLocaleString("pt-BR",
  {minimumFractionDigits:2,maximumFractionDigits:2});
// Versão sem centavos, para onde o espaço é curto (barras, listas compactas).
const fmtI=n=>(n<0?"−":"")+Math.abs(Math.round(n)).toLocaleString("pt-BR");
const fmtMi=n=>{const a=Math.abs(n);
  if(a>=1e6)return (n<0?"−":"")+(a/1e6).toFixed(1).replace(".",",")+" mi";
  if(a>=1e3)return (n<0?"−":"")+(a/1e3).toFixed(0)+" mil"; return fmtC(n);};

const ST={sem:"Sem lançamento",sorc:"Sem orçamento",ana:"Analisar",ok:"Ok com o orçado",zer:"Zerado",abr:"Mês em aberto"};
const STO={sem:0,sorc:1,ana:2,ok:3,zer:4,abr:5};

const amap={}; DB.accts.forEach(a=>amap[a.cod]=a);
const umap={}; DB.units.forEach(u=>umap[u.cod]=u);

// est: "ativa" (lançou algo no período) | "muda" (não lançou nada agora, mas já lançou antes)
//      | "inativa" (nunca lançou nada no ano)
function statusOf(p,r,aberto,est){
  if(aberto) return "abr";
  if(Math.abs(p)>EPS && Math.abs(r)<EPS) return est==="inativa" ? "zer" : "sem";
  if(Math.abs(p)<EPS && Math.abs(r)<EPS) return "zer";
  if(Math.abs(p)<EPS && Math.abs(r)>EPS) return "sorc";   // lançou sem ter orçamento
  return Math.abs(r-p)<EPS ? "ok" : "ana";
}

// cache de métricas por mês
// natureza contábil pelo prefixo da conta (4=custo/despesa, 5=impostos)
function natureza(cod){ return NATLBL[natMap[cod]]||"Outros"; }
// DRE aditivo: despesa negativa. Logo variação > 0 sempre favorece o resultado.
const favor = v => Math.abs(v)<EPS ? "neutro" : (v>0 ? "fav" : "desf");
const FAVLBL={fav:"favorável",desf:"desfavorável",neutro:"—"};

// referência da "confiança": os meses fechados ANTES do período analisado.
// (Nos modos Acum./Sem. a conta pendente não lançou em nenhum mês do período;
//  usar o próprio período daria sempre "nunca lançou".)
function refMeses(){
  const ini=periodo==="mes"?M:faixa()[0];
  const out=[]; for(let i=0;i<ini;i++) if(DB.fechado[i]) out.push(i);
  return out;
}
function confDe(d){
  const ref=refMeses(); if(!ref.length) return "nd";          // sem mês anterior para comparar
  const n=ref.filter(i=>Math.abs(d.r[i])>EPS).length;
  if(n===0) return "baixa";
  if(n>=ref.length-1) return "alta";
  return "media";
}
const CONF={alta:"lançava todo mês",media:"lança às vezes",baixa:"nunca lançou",nd:"sem histórico"};
// texto "N lançavam todo mês" — sem mês anterior ao período, não há como saber
const altaTxt=n=>refMeses().length?n+" lançavam todo mês":"sem histórico anterior";

// Linha conta × unidade que entra na conta de pendência. É a MESMA regra para os
// cartões, tooltips, ranking, "Por conta" e exportação — não duplicar.
//   fora: unidades vigiadas (tela própria) e receita/dedução (não faturar não é falha);
//   respeita o modo (só recorrentes) e o corte de materialidade no período.
function relevante(d){
  if(VIG.has(d.u)) return false;
  if(!ehPendencia(d.a)) return false;
  if(modo==="rec" && !ehRec(d.a)) return false;
  if(corte>0){
    const [p,r]=agr(d);
    if(Math.abs(p)<corte && Math.abs(r)<corte) return false;
  }
  return true;
}

const cache={};
function met(){
  const key=modo+"|"+periodo+"|"+M+"|"+corte;
  if(cache[key]) return cache[key];
  const ms=mesesAtivos(), aberto=ms.length===0;
  const rel=relevante;
  // estado da unidade no período
  const temR={}, jaLancou={};
  DB.units.forEach(u=>{temR[u.cod]=false; jaLancou[u.cod]=false;});
  // "já lançou antes" = em algum mês fechado ANTERIOR ao período (mês posterior não conta:
  // unidade que só começou depois não "parou de lançar")
  const ini=ms.length?ms[0]:M;
  const antes=[]; for(let i=0;i<ini;i++) if(DB.fechado[i]) antes.push(i);
  DB.data.forEach(d=>{ if(!rel(d))return;
    if(ms.some(i=>Math.abs(d.r[i])>EPS)) temR[d.u]=true;
    if(antes.some(i=>Math.abs(d.r[i])>EPS)) jaLancou[d.u]=true; });
  const est={};
  DB.units.forEach(u=>est[u.cod]= temR[u.cod] ? "ativa" : (jaLancou[u.cod] ? "muda" : "inativa"));
  const a={}; DB.units.filter(u=>!u.vig).forEach(u=>a[u.cod]={sem:0,orc:0,plan:0,real:0,expo:0,alta:0,
      sorc:0,vsorc:0,pSem:0, seg:u.seg,nome:u.nome,cod:u.cod});
  DB.data.forEach(d=>{ const o=a[d.u]; if(!o||!rel(d))return;
    let p=0,r=0; ms.forEach(i=>{p+=d.p[i];r+=d.r[i];});
    o.plan+=p; o.real+=r;
    if(Math.abs(p)>EPS) o.orc++;
    const stt=statusOf(p,r,aberto,est[d.u]);
    if(stt==="sem"){
      o.sem++; o.expo+=Math.abs(p); o.pSem+=p;
      if(confDe(d)==="alta") o.alta++;
    } else if(stt==="sorc"){ o.sorc++; o.vsorc+=Math.abs(r); }});
  DB.units.forEach(u=>{ if(a[u.cod]) a[u.cod].est=est[u.cod]; });
  cache[key]={a,aberto,temR,est,ms}; return cache[key];
}
// valores agregados de uma linha no período atual
function agr(d){ const ms=mesesAtivos(); let p=0,r=0;
  ms.forEach(i=>{p+=d.p[i];r+=d.r[i];}); return [p,r]; }

// série 12 meses de uma unidade (para sparkline)
function serie(cod){
  const p=Array(12).fill(0), r=Array(12).fill(0);
  DB.data.forEach(d=>{ if(d.u!==cod)return; for(let i=0;i<12;i++){p[i]+=d.p[i];r[i]+=d.r[i];} });
  return {p,r};
}
function sparkline(cod,w=72,h=26){
  const {p,r}=serie(cod);
  const upto=DB.fechado.lastIndexOf(true)+1||12;
  const vals=[...p.slice(0,upto),...r.slice(0,upto)].map(Math.abs);
  const mx=Math.max(...vals,1);
  const pt=(arr,n)=>arr.slice(0,n).map((v,i)=>
    `${(i/(n-1||1)*w).toFixed(1)},${(h-Math.abs(v)/mx*(h-3)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${pt(p,upto)}" fill="none" stroke="#5D7188" stroke-width="1.3" stroke-dasharray="2.5 2"/>
    <polyline points="${pt(r,upto)}" fill="none" stroke="#22D3EE" stroke-width="1.6"/></svg>`;
}

/* ---------- SIDEBAR ---------- */
function renderNav(){
  const {a}=met();
  const bys={}; Object.values(a).forEach(o=>{bys[o.seg]=(bys[o.seg]||0)+o.sem;});
  const segs=SEG.filter(s=>DB.units.some(u=>u.seg===s&&!u.vig));

       <span class="dot" style="background:${cor(s)}"></span>${SEGNM[s]}
       <span class="n">${bys[s]||0}</span></a>`).join("")
    + (UNS_VIG.length?`<a class="${view.tipo==='exc'?'on':''}" onclick="go({tipo:'exc'})">
       <span class="dot" style="background:var(--red)"></span>Exceções
       <span class="n">${totalExcecoes()||""}</span></a>`:"")
    + `<div class="navlbl" style="padding:14px 8px 7px">Diagnóstico do ano</div>
       <a class="${view.tipo==='lastro'?'on':''}" onclick="go({tipo:'lastro'})">
       <span class="dot" style="background:#A78BFA"></span>Orçamento sem lastro
       <span class="n">${semLastro(6).length}</span></a>
       <a class="${view.tipo==='lsorc'?'on':''}" onclick="go({tipo:'lsorc'})">
       <span class="dot" style="background:#67E8F9"></span>Lastro sem orçamento
       <span class="n">${lastroSemOrc(6).length}</span></a>`;
}

/* ---------- KPIs ---------- */
function renderKpis(){
  const {a,aberto}=met();
  let sem=0,afe=0,plan=0,real=0,un=0,expo=0,alta=0;
  const scope=Object.values(a).filter(o=>
      view.tipo==="hub" ? true : view.tipo==="seg" ? o.seg===view.seg : o.cod===view.unit);
  let mudas=0, expoMudas=0;
  let pSem=0;
  scope.forEach(o=>{sem+=o.sem;if(o.sem>0)afe++;plan+=o.plan;real+=o.real;
      expo+=o.expo;alta+=o.alta;un++;pSem+=o.pSem;
      if(o.est==="muda"){mudas++;expoMudas+=o.expo;}});
  const v=real-plan;
  const pctv=Math.abs(plan)>EPS?(v/Math.abs(plan)*100):null;
  // detalhamento para os tooltips
  const sl=semLancEscopo();
  const cc={alta:0,media:0,baixa:0,nd:0}, cv={alta:0,media:0,baixa:0,nd:0};
  sl.forEach(o=>{cc[o.cf]++; cv[o.cf]+=Math.abs(o.p);});
  const fech=DB.fechado.filter(Boolean).length;
  const linhaC=(k,lbl)=>`<div class="tr2"><span>${lbl}</span><b>${cc[k]} contas</b>
      <span class="tv">R$ ${fmtMi(cv[k])}</span></div>`;

  const tpOrc = view.tipo==="det"
    ? `<b>Contas com orçamento</b><div class="tl">Quantas contas tinham valor orçado para esta unidade em ${DB.meses[M]}/26. É o universo que deveria ter lançamento no mês.</div>`
    : `<b>Unidades</b><div class="tl">${un} unidades no escopo atual${view.tipo==="hub"?" (todos os segmentos)":" ("+SEGNM[view.seg]+")"}.</div>`;
  const tpSem = `<b>${modo==="rec"?"Contas recorrentes sem lançamento":"Contas sem lançamento"}</b>
     <div class="tl">Contas com orçamento em ${faixaLbl()} e realizado zerado no período, <b>mesmo a unidade tendo lançado outras contas</b>. Indica lançamento faltante, não valor zero real.</div>
     ${modo==="rec"?`<div class="tl">Escopo: apenas as ${N_REC} contas classificadas como recorrentes (mais Etiquetagem). São as que deveriam aparecer todo mês.</div>`:""}
     <div class="tsep"></div>${linhaC("alta","Lançavam todo mês")}${linhaC("media","Lançam às vezes")}${linhaC("baixa","Nunca lançaram")}${cc.nd?linhaC("nd","Sem histórico anterior"):""}`;
  const tpExp = `<b>R$ exposto</b>
     <div class="tl">Soma do valor orçado das ${fmtN(sem)} contas sem lançamento. É o quanto de orçamento ainda não apareceu no realizado.</div>
     <div class="tsep"></div>${linhaC("alta","Lançavam todo mês")}${linhaC("media","Lançam às vezes")}${linhaC("baixa","Nunca lançaram")}${cc.nd?linhaC("nd","Sem histórico anterior"):""}

/* ---------- AGREGAÇÃO POR CONTA (dentro do segmento) ---------- */
function contasDoSegmento(sg){
  const {aberto,est}=met();
  const uns=DB.units.filter(u=>u.seg===sg).map(u=>u.cod);
  const set=new Set(uns), mp={};
  DB.data.forEach(d=>{
    if(!set.has(d.u)) return;
    if(!ehPendencia(d.a)) return;               // receita não vira pendência (como nos cartões)
    if(modo==="rec" && !ehRec(d.a)) return;
    const [p,r]=agr(d);
    if(corte>0 && Math.abs(p)<corte && Math.abs(r)<corte) return;
    const st=statusOf(p,r,aberto,est[d.u]);
    const o=mp[d.a]=mp[d.a]||{a:d.a,desc:(amap[d.a]||{}).desc||d.a,rec:ehRec(d.a),
                              orc:0,sem:0,val:0,uns:[],plan:0,real:0};
    if(Math.abs(p)>EPS) o.orc++;
    o.plan+=p; o.real+=r;
    if(st==="sem"){ o.sem++; o.val+=Math.abs(p);
      o.uns.push({cod:d.u,nome:(umap[d.u]||{}).nome||d.u,v:Math.abs(p),muda:est[d.u]==="muda"}); }
  });
  const tot=uns.length;
  return Object.values(mp).filter(o=>o.sem>0).map(o=>{
    o.uns.sort((x,y)=>y.v-x.v);
    o.tot=tot; o.taxa=o.sem/tot;
    o.tipo = o.taxa>=0.5 ? "sistemico" : (o.sem>2 ? "varios" : "isolado");
    return o;
  }).sort((x,y)=>y.sem-x.sem||y.val-x.val);
}
const TIPOLBL={sistemico:"sistêmico",varios:"vários",isolado:"isolado"};

// A receita fica fora da conta de pendência, mas precisa aparecer no
// resultado — senão a variação de custo sozinha dá impressão errada.
function resumoResultado(codigos){
  const set=new Set(codigos), ms=mesesAtivos();
  let rp=0,rr=0,cp=0,cr=0,sorcN=0,sorcV=0;
  DB.data.forEach(d=>{
    if(!set.has(d.u)) return;
    let p=0,r=0; ms.forEach(i=>{p+=d.p[i];r+=d.r[i];});
    if(ehResultado(d.a)){ rp+=p; rr+=r; }
    else {
      cp+=p; cr+=r;
      if(Math.abs(p)<EPS&&Math.abs(r)>EPS){ sorcN++; sorcV+=Math.abs(r); }
    }});
  const resP=rp+cp, resR=rr+cr;
  return {rp,rr,cp,cr,resP,resR,
          margem: rr>0?(resR/rr*100):null, margemP: rp>0?(resP/rp*100):null,
          sorcN,sorcV};
}
function faixaResultado(codigos){
  const o=resumoResultado(codigos);
  if(!mesesAtivos().length) return "";
  const cel=(lbl,p,r,cor)=>{
    const v=r-p;
    return `<div class="fr" ${T(`<b>${lbl}</b>
       <div class="tr2"><span>Orçado</span><b class="num">${fmtC(p)}</b></div>
       <div class="tr2"><span>Realizado</span><b class="num">${fmtC(r)}</b></div>
       <div class="tr2"><span>Variação</span><b class="num ${v<0?'neg':'pos'}">${fmtC(v)}</b></div>`)}>
      <span class="frl">${lbl}</span>
      <span class="frv num" style="color:${cor}">${fmtMi(r)}</span>
      <span class="frd num ${v<0?'neg':'pos'}">${v<0?"":"+"}${fmtMi(v)}</span></div>`;
  };
  return `<div class="faixar">
    ${cel("Receita líquida",o.rp,o.rr,"var(--grn)")}
    ${cel("Custos e despesas",o.cp,o.cr,"var(--red)")}
    ${cel("Resultado",o.resP,o.resR,o.resR>=0?"var(--cy)":"var(--red)")}
    <div class="fr" ${T(`<b>Margem</b><div class="tl">Resultado dividido pela receita líquida.</div>
        ${o.margemP!=null?`<div class="tr2"><span>Orçada</span><b>${pct(o.margemP)}</b></div>`:""}`)}>
      <span class="frl">Margem</span>
      <span class="frv num">${o.margem==null?"—":pct(o.margem,1)}</span>
      <span class="frd num" style="color:var(--dim)">${o.margemP==null?"":"orç. "+pct(o.margemP,1)}</span></div>
    ${o.sorcN?`<div class="fr alerta3" onclick="${codigos.length===1?`setAba('var')`:``}"
        ${T(`<b>Gasto fora do orçado</b><div class="tl">${o.sorcN} contas tiveram lançamento sem nenhum orçamento no período.</div>`)}>
      <span class="frl">Fora do orçado</span>
      <span class="frv num" style="color:#C4B5FD">${fmtMi(o.sorcV)}</span>
      <span class="frd num" style="color:var(--dim)">${o.sorcN} contas</span></div>`:""}
  </div>`;
}

/* ---------- RESULTADO DA UNIDADE (receita × custo) ---------- */
// A receita não serve para cobrar lançamento, mas serve para medir a unidade.
const ORDEM_NAT=["rec","ded","cd","out","fin","imp"];
function resultado(cod){
  const ms=mesesAtivos(), g={};
  ORDEM_NAT.forEach(n=>g[n]={p:0,r:0,linhas:[]});
  DB.data.forEach(d=>{
    if(d.u!==cod) return;
    const n=natMap[d.a]; if(!g[n]) return;
    let p=0,r=0; ms.forEach(i=>{p+=d.p[i];r+=d.r[i];});
    if(Math.abs(p)<EPS&&Math.abs(r)<EPS) return;
    g[n].p+=p; g[n].r+=r;
    g[n].linhas.push({a:d.a,desc:(amap[d.a]||{}).desc||d.a,p,r,v:r-p});
  });
  const tp=ORDEM_NAT.reduce((s,n)=>s+g[n].p,0);
  const tr=ORDEM_NAT.reduce((s,n)=>s+g[n].r,0);
  return {g,tp,tr};
}
// série mensal de receita e resultado, para o gráfico
function serieResultado(cod){
  const rec=Array(12).fill(0), res=Array(12).fill(0), cus=Array(12).fill(0);
  DB.data.forEach(d=>{
    if(d.u!==cod) return;
    const n=natMap[d.a];
    for(let i=0;i<12;i++){
      res[i]+=d.r[i];
      if(n==="rec"||n==="ded") rec[i]+=d.r[i]; else cus[i]+=d.r[i];
    }});
  return {rec,cus,res};
}
function renderResultado(cod){
  const {g,tp,tr}=resultado(cod);
  const ms=mesesAtivos();
  if(!ms.length) return `<div class="empty">Mês em aberto: sem realizado para comparar.</div>`;
  const linha=(n)=>{
    const o=g[n], v=o.r-o.p;
    if(Math.abs(o.p)<EPS&&Math.abs(o.r)<EPS) return "";
    const pc=Math.abs(o.p)>EPS?((v/Math.abs(o.p))*100):null;
    return `<tr><td>${NATLBL[n]}</td>
      <td class="r num">${fmtC(o.p)}</td><td class="r num">${fmtC(o.r)}</td>
      <td class="r num ${v<0?'neg':'pos'}">${fmtC(v)}</td>
      <td class="r num" style="color:var(--mut)">${pc==null||Math.abs(o.p)<1000?"—":pct(pc,0)}</td>
      <td>${Math.abs(v)<EPS?"":`<span class="fv ${favor(v)}">${FAVLBL[favor(v)]}</span>`}</td></tr>`;
  };
  const marg = (rr)=>{ const receita=g.rec.r+g.ded.r; return receita>0?(rr/receita*100):null; };
  const mr=marg(tr), mp=(g.rec.p+g.ded.p)>0?(tp/(g.rec.p+g.ded.p)*100):null;
  // gráfico de barras mensal
  const sr=serieResultado(cod);
  const fech=[...Array(12).keys()].filter(i=>DB.fechado[i]);
  const mx=Math.max(...fech.map(i=>Math.max(Math.abs(sr.rec[i]),Math.abs(sr.cus[i]))),1);
  const H=54;
  const barras=fech.map(i=>{
    const hr=Math.max(1,Math.abs(sr.rec[i])/mx*H), hc=Math.max(1,Math.abs(sr.cus[i])/mx*H);
    const pos=sr.res[i]>=0;
    return `<div class="gcol" ${T(`<b>${DB.meses[i]}/26</b>
        <div class="tr2"><span>Receita líquida</span><b class="num">${fmtC(sr.rec[i])}</b></div>
        <div class="tr2"><span>Custos e despesas</span><b class="num">${fmtC(sr.cus[i])}</b></div>
        <div class="tr2"><span>Resultado</span><b class="num ${pos?'pos':'neg'}">${fmtC(sr.res[i])}</b></div>`)}>
      <div class="gpar"><div class="gb rec" style="height:${hr}px"></div>
        <div class="gb cus" style="height:${hc}px"></div></div>
      <div class="gm${i===M?" at":""}">${DB.meses[i]}</div>
      <div class="gr ${pos?"pos":"neg"}">${pos?"+":"−"}</div></div>`;}).join("");

  return `<div class="expl" style="border-left:3px solid var(--grn)">
      <div class="rhead"><span>Resultado em ${faixaLbl()}</span>
        <span class="rres ${tr>=0?'pos':'neg'}">${fmtC(tr)}</span>
        ${mr!=null?`<span class="rmar">margem ${pct(mr)}${mp!=null?` · orçada ${pct(mp)}`:""}</span>`:""}</div>
      <table class="mini rtab"><thead><tr><th>Natureza</th><th class="r">Orçado</th>
        <th class="r">Realizado</th><th class="r">Variação</th><th class="r">%</th><th>Efeito</th></tr></thead>
        <tbody>${ORDEM_NAT.map(linha).join("")}
        <tr class="rtot"><td>Resultado</td><td class="r num">${fmtC(tp)}</td>
          <td class="r num">${fmtC(tr)}</td>
          <td class="r num ${tr-tp<0?'neg':'pos'}">${fmtC(tr-tp)}</td><td></td>
          <td><span class="fv ${favor(tr-tp)}">${FAVLBL[favor(tr-tp)]}</span></td></tr>
        </tbody></table>
      <div class="graf"><div class="glbl">Receita líquida <i class="sw rec"></i>
        &nbsp; Custos e despesas <i class="sw cus"></i> &nbsp;
        <span style="color:var(--dim)">sinal abaixo = resultado do mês</span></div>
        <div class="gwrap">${barras}</div></div>
    </div>`;
}

/* ---------- EXCEÇÕES: lançamentos em unidades que não deveriam ter ---------- */
// Estas unidades saíram da operação. Não têm lançamento recorrente previsto,
// então qualquer movimento nelas é exceção e precisa ser repassado.
function excecoes(){
  const ms=mesesAtivos(), out=[];
  DB.units.filter(u=>u.vig).forEach(u=>{
    const linhas=[];
    DB.data.forEach(d=>{
      if(d.u!==u.cod) return;
      let p=0,r=0; ms.forEach(i=>{p+=d.p[i];r+=d.r[i];});
      if(Math.abs(r)<EPS) return;                       // só interessa o que foi lançado
      const meses=[];
      for(let i=0;i<12;i++) if(DB.fechado[i]&&Math.abs(d.r[i])>EPS) meses.push(DB.meses[i]);
      linhas.push({a:d.a,desc:(amap[d.a]||{}).desc||d.a,nat:natureza(d.a),
                   p,r,ano:d.r.reduce((s,x)=>s+Math.abs(x),0),meses});
    });
    linhas.sort((x,y)=>Math.abs(y.r)-Math.abs(x.r));
    const anoN=DB.data.filter(d=>d.u===u.cod)
      .reduce((s,d)=>s+d.r.filter((v,i)=>DB.fechado[i]&&Math.abs(v)>EPS).length,0);
    out.push({u,linhas,val:linhas.reduce((s,l)=>s+Math.abs(l.r),0),anoN});
  });
  return out.sort((a,b)=>b.val-a.val);
}
function totalExcecoes(){ return excecoes().reduce((s,o)=>s+o.linhas.length,0); }

function renderExcecoes(){
  const lst=excecoes();
  const comMov=lst.filter(o=>o.linhas.length);
  const tot=lst.reduce((s,o)=>s+o.val,0);
  document.getElementById("kpis").innerHTML=`
   <div class="kpi ${comMov.length?"r":"g"}"><div class="lbl">Unidades com movimento</div>

/* ---------- ORÇAMENTO SEM LASTRO (visão do ano) ---------- */
// Linhas orçadas em vários meses e que nunca tiveram lançamento nenhum no ano.
// Não é falha de lançamento: é orçamento que não se sustenta. Insumo do próximo ciclo.
function semLastro(minMeses){
  const fech=[...Array(12).keys()].filter(i=>DB.fechado[i] && !ehParcial(i));
  const out=[];
  DB.data.forEach(d=>{
    if(!ehPendencia(d.a)) return;
    if(modo==="rec" && !ehRec(d.a)) return;
    const mo=fech.filter(i=>Math.abs(d.p[i])>EPS).length;
    const mr=fech.filter(i=>Math.abs(d.r[i])>EPS).length;
    if(mo<minMeses || mr>0) return;
    const val=fech.reduce((s,i)=>s+Math.abs(d.p[i]),0);
    if(corte>0 && val<corte) return;
    out.push({u:d.u,nome:(umap[d.u]||{}).nome||d.u,seg:(umap[d.u]||{}).seg,
              a:d.a,desc:(amap[d.a]||{}).desc||d.a,meses:mo,val,
              media:val/(mo||1), rec:ehRec(d.a)});
  });
  return out.sort((x,y)=>y.val-x.val);
}

/* ---------- HISTÓRICO DE PENDÊNCIAS POR MÊS ---------- */
const cacheHist={};
function histPendencias(cod){
  const key=cod+"|"+modo;
  if(cacheHist[key]) return cacheHist[key];
  const linhas=DB.data.filter(d=>d.u===cod && ehPendencia(d.a) && (modo!=="rec"||ehRec(d.a)));
  const out=[];
  for(let i=0;i<12;i++){
    if(!DB.fechado[i]){ out.push(null); continue; }
    const lancouAgora=linhas.some(d=>Math.abs(d.r[i])>EPS);
    const lancouAntes=linhas.some(d=>{ for(let j=0;j<i;j++) if(DB.fechado[j]&&Math.abs(d.r[j])>EPS) return true; return false; });
    const est=lancouAgora?"ativa":(lancouAntes?"muda":"inativa");
    let n=0,val=0;
    linhas.forEach(d=>{
      const p=d.p[i],r=d.r[i];
      if(statusOf(p,r,false,est)==="sem"){n++;val+=Math.abs(p);}
    });
    out.push({mes:DB.meses[i],n,val,muda:est==="muda",inativa:est==="inativa",parcial:ehParcial(i),i});
  }
  cacheHist[key]=out; return out;
}
// Tendência das pendências. Quase toda unidade tem pendência todo mês,
// então "crônico" não separa nada — o que informa é se está piorando.
// Meses em que a unidade não lançou nada ficam de fora (já têm alerta próprio).
// Há quantos meses seguidos a conta está orçada e sem nenhum lançamento.
// Diz onde a falha virou crônica, em vez de só contar quantas são.
function semLancarHa(cod){
  const fech=[...Array(12).keys()].filter(i=>DB.fechado[i]);
  const out=[];
  DB.data.forEach(d=>{
    if(d.u!==cod) return;
    if(!ehPendencia(d.a)) return;
    if(modo==="rec" && !ehRec(d.a)) return;
    let seq=0,val=0,ult=null,desde=null;
    for(let k=fech.length-1;k>=0;k--){
      const i=fech[k];
      if(ehParcial(i)) continue;                 // mês parcial não conta nem interrompe
      const temO=Math.abs(d.p[i])>EPS, temR=Math.abs(d.r[i])>EPS;
      if(temR){ ult=DB.meses[i]; break; }
      if(temO){ seq++; val+=Math.abs(d.p[i]); desde=DB.meses[i]; }
      else if(seq>0) break;
    }
    if(seq>=2) out.push({a:d.a,desc:(amap[d.a]||{}).desc||d.a,seq,val,ult,desde,rec:ehRec(d.a)});
  });
  return out.sort((x,y)=>y.seq-x.seq||y.val-x.val);
}
function renderSemLancarHa(cod){
  const lst=semLancarHa(cod);
  if(!lst.length) return `<div class="expl2" style="margin-top:12px">Nenhuma conta acumula dois meses ou mais sem lançamento.</div>`;
  const mx=Math.max(...lst.map(o=>o.seq),1);
  return `<div class="expl" style="border-left:3px solid var(--amb);margin-top:12px">

     <table class="mini"><thead><tr><th>Conta</th><th class="r">Meses seguidos</th>

function padraoUnidade(cod){
  // fora: meses em que a unidade não lançou nada (já têm alerta próprio ou ainda não tinha começado)
  const h=histPendencias(cod).filter(m=>m && !m.muda && !m.inativa && !m.parcial);
  if(!h.length) return {tipo:"limpa",txt:"sem base de comparação"};
  if(h.every(m=>m.n===0)) return {tipo:"limpa",txt:"sem pendências no período"};
  if(h.length<6) return {tipo:"estavel",txt:"histórico curto"};
  const med=a=>a.reduce((s,m)=>s+m.n,0)/a.length;
  const ant=med(h.slice(-6,-3)), rec=med(h.slice(-3));
  const txt=`média ${ant.toFixed(0)} → ${rec.toFixed(0)} contas/mês`;
  if(ant===0&&rec===0) return {tipo:"limpa",txt:"sem pendências recentes"};
  if(rec>ant*1.3 && rec-ant>=1) return {tipo:"piorando",txt};
  if(rec<ant*0.7) return {tipo:"melhorando",txt};
  return {tipo:"estavel",txt};
}
const PADLBL={piorando:"piorando",melhorando:"melhorando",estavel:"estável",limpa:"sem pendências"};

/* ---------- SINAIS DE ATENÇÃO (anomalia e conta trocada) ---------- */
const mediana=xs=>{const a=[...xs].sort((x,y)=>x-y),n=a.length;
  return n?(n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2):0;};
const madv=xs=>{const m=mediana(xs);return mediana(xs.map(x=>Math.abs(x-m)));};

// histórico mensal (meses fechados fora do período analisado)
function baseHist(){
  const ms=mesesAtivos();
  return [...Array(12).keys()].filter(i=>DB.fechado[i] && !ms.includes(i));
}
// valor médio por mês no período atual (comparável com a mediana histórica)
function medioPeriodo(d){
  const ms=mesesAtivos(); if(!ms.length) return 0;
  return ms.reduce((s,i)=>s+Math.abs(d.r[i]),0)/ms.length;
}
function perfil(d,hist){
  const h=hist.map(i=>Math.abs(d.r[i])).filter(v=>v>EPS);
  return {n:h.length, med:mediana(h), mad:madv(h)};
}

// contas com valor fora do padrão da própria série
function anomalias(cod){
  const hist=baseHist(), out=[];
  DB.data.forEach(d=>{
    if(d.u!==cod) return;
    if(!ehPendencia(d.a)) return;
    if(modo==="rec" && !ehRec(d.a)) return;
    const {n,med,mad}=perfil(d,hist);
    if(n<4 || med<=0) return;
    const at=medioPeriodo(d); if(at<EPS) return;
    let dv=mad; if(dv<1) dv=med*0.15||1;
    const z=(at-med)/dv;
    if(Math.abs(z)>=4 && Math.abs(at-med)>20000)
      out.push({a:d.a,desc:(amap[d.a]||{}).desc||d.a,med,at,z,raz:med?at/med:0});
  });
  return out.sort((x,y)=>Math.abs(y.z)-Math.abs(x.z));
}

// pares: conta que sumiu × conta com pico de valor parecido (possível troca)
function paresTrocados(cod){
  const hist=baseHist(), ms=mesesAtivos(), faltam=[], picos=[];
  DB.data.forEach(d=>{
    if(d.u!==cod) return;
    if(!ehPendencia(d.a)) return;
    if(modo==="rec" && !ehRec(d.a)) return;
    const [p,r]=agr(d), {n,med}=perfil(d,hist);
    const at=medioPeriodo(d);
    if(Math.abs(p)>EPS && Math.abs(r)<EPS && n>=4 && med>5000)
      faltam.push({a:d.a,med});
    if(at>EPS){
      const exc=at-med;
      if((med>0 && exc>Math.max(5000,med*0.8)) || (med===0 && at>5000))
        picos.push({a:d.a,exc:med>0?exc:at});
    }
  });
  const grupo=c=>String(c).split(".").slice(0,4).join(".");
  const parcial=ms.some(ehParcial);
  const out=[];
  faltam.forEach(f=>picos.forEach(pk=>{
    if(f.a===pk.a) return;
    const raz=Math.min(f.med,pk.exc)/Math.max(f.med,pk.exc);
    const mesmo=grupo(f.a)===grupo(pk.a);
    // em fechamento parcial muita conta está "sumida" só porque ainda não lançaram:
    // qualquer coincidência de valor vira par. Aí só aceitamos o mesmo grupo contábil.
    if(parcial && !mesmo) return;
    if(raz<(mesmo?0.75:0.95)) return;               // fora do grupo, exige quase exato
    out.push({fa:f.a,fdesc:(amap[f.a]||{}).desc||f.a,fmed:f.med,
              pa:pk.a,pdesc:(amap[pk.a]||{}).desc||pk.a,pexc:pk.exc,
              mesmo,score:raz*(mesmo?1:0.6)});
  }));
  // um par por conta que sumiu: fica só o candidato mais forte
  out.sort((x,y)=>y.score-x.score);
  const vistos=new Set(), fin=[];
  out.forEach(o=>{ if(vistos.has(o.fa))return; vistos.add(o.fa); fin.push(o); });
  return fin.slice(0,5);
}

// mapa de calor: unidades x meses, intensidade = pendências
// contas com orçamento e sem lançamento de uma unidade num mês específico
function contasDoMes(cod,i){
  const out=[];
  const linhas=DB.data.filter(d=>d.u===cod && ehPendencia(d.a) && (modo!=="rec"||ehRec(d.a)));
  const lancou=linhas.some(d=>Math.abs(d.r[i])>EPS);
  const antes=linhas.some(d=>{ for(let j=0;j<i;j++) if(DB.fechado[j]&&Math.abs(d.r[j])>EPS) return true; return false; });
  const est=lancou?"ativa":(antes?"muda":"inativa");
  linhas.forEach(d=>{
    const p=d.p[i], r=d.r[i];
    if(statusOf(p,r,false,est)!=="sem") return;
    out.push({a:d.a,desc:(amap[d.a]||{}).desc||d.a,v:Math.abs(p),rec:ehRec(d.a)});
  });
  return out.sort((x,y)=>y.v-x.v);
}

    <div class="tw mapa"><table><thead><tr><th>Unidade</th>

// tabela de contas do segmento
// Uma conta, todas as unidades ativas do segmento, orçado x realizado no período.
function contaNoSegmento(sg,conta){
  const {aberto,est}=met();
  const uns=DB.units.filter(u=>u.seg===sg&&!u.vig);
  const linhas=[];
  uns.forEach(u=>{
    const d=DB.data.find(x=>x.u===u.cod&&x.a===conta);
    let p=0,r=0;
    if(d){ const [pp,rr]=agr(d); p=pp; r=rr; }
    if(Math.abs(p)<EPS&&Math.abs(r)<EPS&&!d) return;   // conta nem existe nessa unidade
    const st=statusOf(p,r,aberto,est[u.cod]);
    linhas.push({cod:u.cod,nome:u.nome,p,r,v:r-p,st,
                 cf:d?confDe(d):"baixa"});
  });
  // ordem: pendências primeiro, depois maior orçado
  linhas.sort((x,y)=>(x.st==="sem"?0:1)-(y.st==="sem"?0:1)||Math.abs(y.p)-Math.abs(x.p));
  return linhas;
}

/* ---------- DETALHE ---------- */
function linhas(){
  const {aberto,est}=met(), u=view.unit, out=[];
  DB.data.forEach(d=>{
    if(d.u!==u) return;
    if(!ehPendencia(d.a)) return;                 // receita fica na aba Resultado
    if(modo==="rec" && !ehRec(d.a)) return;
    const [p,r]=agr(d);
    if(Math.abs(p)<EPS && Math.abs(r)<EPS) return;
    if(corte>0 && Math.abs(p)<corte && Math.abs(r)<corte) return;
    const ac=amap[d.a]||{desc:"",rec:"—",fv:"—"};
    out.push({a:d.a,desc:ac.desc,p,r,v:r-p,
      pct:Math.abs(p)>EPS?(r-p)/Math.abs(p):null,
      st:statusOf(p,r,aberto,est[u]), cf:confDe(d),
      nat:natureza(d.a), fav:favor(r-p), hist:histDe(d),
      rec:ehRec(d.a), d,
      cls:(ac.fv||"—")+" · "+(ac.rec||"—")});});
  return out;
}
// tabela mês a mês de uma conta (expansão da linha)
function mesATes(d){
  const ms=[]; for(let i=0;i<12;i++) if(DB.fechado[i]) ms.push(i);
  const cel=i=>{const p=d.p[i],r=d.r[i],v=r-p;
    const falta=Math.abs(p)>EPS&&Math.abs(r)<EPS;
    return `<td class="r num${falta?" falta":""}">${fmtC(r)}</td>`;};
  return `<tr class="exp"><td colspan="11"><div class="expbox">
    <div class="expt">Orçado × realizado mês a mês${modo==="rec"?" · conta recorrente":""}</div>
    <table class="mini"><thead><tr><th></th>${ms.map(i=>`<th class="r">${DB.meses[i]}</th>`).join("")}<th class="r">Total</th></tr></thead>
    <tbody>
      <tr><td>Orçado</td>${ms.map(i=>`<td class="r num">${fmtC(d.p[i])}</td>`).join("")}
          <td class="r num b">${fmtC(ms.reduce((s,i)=>s+d.p[i],0))}</td></tr>
      <tr><td>Realizado</td>${ms.map(cel).join("")}
          <td class="r num b">${fmtC(ms.reduce((s,i)=>s+d.r[i],0))}</td></tr>
      <tr class="vr"><td>Variação</td>${ms.map(i=>{const v=d.r[i]-d.p[i];
          return `<td class="r num ${v<0?'neg':'pos'}">${Math.abs(v)<EPS?"—":fmtC(v)}</td>`;}).join("")}
          <td class="r num b">${fmtC(ms.reduce((s,i)=>s+d.r[i]-d.p[i],0))}</td></tr>
    </tbody></table>
    <div class="expl2">Células destacadas: mês com orçamento e sem nenhum lançamento.</div>
  </div></td></tr>`;
}
function renderDet(){
  const u=umap[view.unit];

  const cont={todos:rows.length}; rows.forEach(r=>cont[r.st]=(cont[r.st]||0)+1);
  const chips=[["todos","Todas"],["sem","Sem lançamento"],["sorc","Sem orçamento"],["ana","Analisar"],["ok","Ok"],["zer","Zerado"]]
    .filter(([k])=>k==="todos"||cont[k])
    .map(([k,l])=>`<div class="chip ${view.filtro===k?'on':''}" onclick="setF(${js(k)})">${l}<span class="c num">${cont[k]||0}</span></div>`).join("");

  if(view.filtro!=="todos") rows=rows.filter(r=>r.st===view.filtro);
  if(view.busca){const q=view.busca.toLowerCase();
    rows=rows.filter(r=>r.desc.toLowerCase().includes(q)||r.a.includes(q));}
  const k=view.sk,dir=view.sd;
  rows.sort((x,y)=>{let A,B;
    if(k==="st"){A=STO[x.st];B=STO[y.st];return dir*(A-B)||Math.abs(y.v)-Math.abs(x.v);}
    if(k==="v"){A=Math.abs(x.v);B=Math.abs(y.v);return dir*(B-A);}
    if(k==="cf"){const O={alta:0,media:1,baixa:2,nd:3};
      return dir*((O[x.cf]??9)-(O[y.cf]??9))||Math.abs(y.v)-Math.abs(x.v);}
    if(k==="fav"){const O={desf:0,neutro:1,fav:2};
      return dir*((O[x.fav]??9)-(O[y.fav]??9))||Math.abs(y.v)-Math.abs(x.v);}
    if(k==="a"||k==="desc"||k==="cls"||k==="nat"){return dir*String(x[k]).localeCompare(String(y[k]));}
    A=x[k]??-Infinity;B=y[k]??-Infinity;return dir*(B-A);});

  const mxv=Math.max(...rows.map(r=>Math.abs(r.v)),1);

      <td class="nat">${r.nat}</td>
      <td>${r.st==="sem"?'<span style="color:var(--s3)">—</span>':`<span class="fv ${r.fav}">${FAVLBL[r.fav]}</span>`}</td>

      <td>${r.st==="sem"?`<span class="cf ${r.cf}" ${T(tipHist(r.hist,r.cf))}>${CONF[r.cf]}</span>`:'<span style="color:var(--s3)">—</span>'}</td>
      <td class="cls">${he(r.cls)}</td></tr>`+(expandida===r.a?mesATes(r.d):"")).join("")
    :`<tr><td colspan="11"><div class="empty">Nenhuma conta neste filtro.</div></td></tr>`;

  const all=linhas();
  // BLOCO 0 — histórico de pendências mês a mês
  const hp=histPendencias(view.unit), pad=padraoUnidade(view.unit);
  const mx0=Math.max(...hp.filter(Boolean).map(m=>m.n),1);
  const b0=`<div class="expl hpbox">
     <div class="hph"><span>Histórico de pendências por mês</span>
       <span class="pad ${pad.tipo}">${PADLBL[pad.tipo]}${pad.txt?" · "+pad.txt:""}</span></div>
     <div class="hpg">${hp.map((m,i)=>{
        if(!m||m.inativa) return `<div class="hpc off"${m?` ${T(`<b>${m.mes}/26</b><div class="tl">A unidade ainda não tinha lançado nada no ano até este mês.</div>`)}`:""}><div class="hpb"></div><div class="hpm">${DB.meses[i]}</div></div>`;
        const alt=Math.max(3,Math.round(m.n/mx0*46));
        return `<div class="hpc${i===M?" atual":""}${m.parcial?" parc":""}" ${T(`<b>${m.mes}/26</b>${m.parcial?' <span style="color:#F3C784">(fechamento parcial)</span>':""}
           <div class="tl">${m.n} conta(s) com orçamento e sem lançamento</div>
           <div class="tl">R$ ${fmtMi(m.val)} exposto</div>

           <div class="hpn">${m.n||""}</div>

  // BLOCO 1 — prioridade: contas com orçamento e sem nenhum realizado, por valor

  const mx1=Math.max(...semL.map(r=>Math.abs(r.p)),1);
  const b1=semL.length?`<div class="expl" style="border-left:3px solid var(--red)">

     ${semL.length>5?`<div style="font-size:11px;color:var(--dim);margin-top:7px;cursor:pointer"
        onclick="setF('sem')">ver as ${semL.length} contas →</div>`:""}
     </div>`:"";

  // BLOCO 2 — variação de quem teve orçado E realizado
  const amb=all.filter(r=>r.st==="ana"||r.st==="ok");

     </div>`:"";
  // BLOCO 2b — lançou sem ter orçamento
  const tSorc=sorc.reduce((a,r)=>a+Math.abs(r.r),0);

  const b2b=sorc.length?`<div class="expl" style="border-left:3px solid #A78BFA">
     <div style="font-size:10.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px">
       Lançou sem ter orçamento &nbsp;·&nbsp; <b style="color:#C4B5FD">${sorc.length} contas · R$ ${fmtMi(tSorc)}</b></div>

     ${sorc.length>5?`<div style="font-size:11px;color:var(--dim);margin-top:7px;cursor:pointer"

  // BLOCO 3 — sinais de atenção
  const an=anomalias(view.unit), pr=paresTrocados(view.unit);

let palSel=0, palItens=[], palGlobal=false;

// Escopo: se o usuário está dentro de um segmento, a busca começa por ele.
function palEscopo(){
  if(palGlobal) return null;
  if(view.tipo==="seg") return view.seg;
  if(view.tipo==="det" && umap[view.unit]) return umap[view.unit].seg;
  return null;

  const i=document.getElementById("palin"); i.value=""; i.focus(); montaPal("");

  palGlobal=!palGlobal;

const semAcento=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

function montaPal(q){
  const termo=semAcento(q).trim();
  const sg=palEscopo();
  const unsEscopo=DB.units.filter(u=>!sg||u.seg===sg);
  const res=[];

  // segmentos
  SEG.concat(UNS_VIG.length?["Vigiada"]:[]).forEach(x=>{
    if(!DB.units.some(u=>u.seg===x)) return;
    const nome=SEGNM[x]||x;
    if(termo && !semAcento(nome).includes(termo)) return;
    res.push({t:"Segmento",n:nome,
      go:()=>x==="Vigiada"?go({tipo:"exc"}):go({tipo:"seg",seg:x})});
  });

  // unidades
  unsEscopo.forEach(u=>{
    if(termo && !semAcento(u.nome).includes(termo) && !u.cod.toLowerCase().includes(termo)) return;
    res.push({t:SEGNM[u.seg]||u.seg,n:u.nome,x:u.cod,
      go:()=>u.vig?go({tipo:"exc"}):go({tipo:"det",seg:u.seg,unit:u.cod})});
  });

  // contas: devolve a conta E em qual unidade ela está, dentro do escopo
  if(termo){
    const codsEscopo=new Set(unsEscopo.filter(u=>!u.vig).map(u=>u.cod));
    const achadas=DB.accts.filter(a=>
      semAcento(a.desc).includes(termo) || a.cod.includes(termo));
    const {aberto,est}=met();
    achadas.slice(0,12).forEach(a=>{
      const ocor=[];
      DB.data.forEach(d=>{
        if(d.a!==a.cod || !codsEscopo.has(d.u)) return;
        const [p,r]=agr(d);
        if(Math.abs(p)<EPS && Math.abs(r)<EPS) return;
        ocor.push({u:d.u,nome:(umap[d.u]||{}).nome||d.u,
                   st:statusOf(p,r,aberto,est[d.u]),v:Math.abs(p)||Math.abs(r)});
      });
      // pendências primeiro, depois maior valor
      ocor.sort((x,y)=>(x.st==="sem"?0:1)-(y.st==="sem"?0:1)||y.v-x.v);
      const pend=ocor.filter(o=>o.st==="sem").length;
      if(!ocor.length){
        res.push({t:"Conta",n:a.desc,x:a.cod,nota:"sem movimento no escopo",go:null});
        return;
      }
      ocor.slice(0,6).forEach(o=>{
        res.push({t:"Conta",n:a.desc,sub:o.nome,x:a.cod,
          tagsem:o.st==="sem",
          go:()=>{ go({tipo:"det",seg:umap[o.u].seg,unit:o.u});
                   view.filtro="todos"; view.busca=a.desc; aba="pend"; renderDet(); }});
      });
      if(ocor.length>6) res.push({t:"Conta",n:a.desc,
        nota:`e mais ${ocor.length-6} unidade(s)${pend?` · ${pend} com pendência`:""}`,go:null});
    });
  }

  palItens=res.slice(0,50); palSel=0; pintaPal();
}

  const sg=palEscopo();

     <span>${sg?`Buscando em <b>${SEGNM[sg]||sg}</b>`:"Buscando em <b>todos os segmentos</b>"}</span>
     ${(view.tipo==="seg"||view.tipo==="det")?`<button class="palbt" onclick="alternaEscopo()">${
        palGlobal?"restringir ao segmento":"buscar em todos"}</button>`:""}
   </div>`;
  document.getElementById("palcab").innerHTML=cab;
  document.getElementById("pallist").innerHTML=(palItens.length

        onclick="palGo(${i})">

}

function abreConta(unidade,conta){

document.addEventListener("keydown",e=>{
  const aberto=document.getElementById("pal").classList.contains("on");
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); aberto?fechaPal():abrePal(); return; }
  if(aberto){
    if(e.key==="Escape"){ fechaPal(); return; }
    if(e.key==="ArrowDown"){ e.preventDefault();
      do{ palSel=Math.min(palSel+1,palItens.length-1); }while(palItens[palSel]&&!palItens[palSel].go&&palSel<palItens.length-1);
      pintaPal(); return; }
    if(e.key==="ArrowUp"){ e.preventDefault();
      do{ palSel=Math.max(palSel-1,0); }while(palItens[palSel]&&!palItens[palSel].go&&palSel>0);
      pintaPal(); return; }
    if(e.key==="Enter"){ e.preventDefault(); palGo(palSel); return; }
    if(e.key==="Tab"){ e.preventDefault(); alternaEscopo(); return; }
    return;
  }
  // atalhos globais
  const digitando=["INPUT","TEXTAREA","SELECT"].includes((e.target.tagName||""));
  if(digitando||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  const segs=SEG.filter(x=>DB.units.some(u=>u.seg===x&&!u.vig));
  if(/^[1-9]$/.test(k)){ const sg=segs[+k-1]; if(sg){ e.preventDefault(); go({tipo:"seg",seg:sg}); } return; }
  if(k==="h"){ e.preventDefault(); go({tipo:"hub"}); return; }
  if(k==="e"&&UNS_VIG.length){ e.preventDefault(); go({tipo:"exc"}); return; }
  if(k==="l"){ e.preventDefault(); go({tipo:"lastro"}); return; }
  if(k==="p"){ e.preventDefault(); window.print(); return; }
  if(k==="g"){ e.preventDefault(); abreGuia(); return; }
  if(k==="r"){ e.preventDefault(); modo=modo==="rec"?"geral":"rec"; sincronizaBotoes(); render(); return; }
  if(k==="?"||(e.shiftKey&&k==="/")){ e.preventDefault();
    tip.innerHTML=ajuda(); tip.classList.add("fixo"); tip.style.display="block";
    tip.style.left=Math.max(16,innerWidth/2-170)+"px"; tip.style.top="80px";
    const fecha=()=>{ tip.classList.remove("fixo"); tip.style.display="none";
      document.removeEventListener("click",fecha); document.removeEventListener("keydown",fecha,true); };
    setTimeout(()=>{ document.addEventListener("click",fecha);
      document.addEventListener("keydown",fecha,true); },80);
    return; }
  if(view.tipo==="det"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){
    const ord=["pend","var","res","sin","hist"], i=ord.indexOf(aba);
    const j=e.key==="ArrowRight"?Math.min(i+1,ord.length-1):Math.max(i-1,0);
    if(i!==j){ e.preventDefault(); setAba(ord[j]); } return; }
  if(e.key==="Escape"){
    if(document.getElementById("guia").classList.contains("on")){ fechaGuia(); return; }
    if(view.tipo==="det") go({tipo:"seg",seg:view.seg});
    else if(view.tipo!=="hub") go({tipo:"hub"});
  }
});

/* ============ GERADOR DE XLSX (multi-aba) ============ */
const _crcT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}
  return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=_crcT[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipar(files){
  const enc=new TextEncoder(), locais=[], centrais=[]; let off=0, total=0;
  files.forEach(f=>{
    const nb=enc.encode(f.name), data=f.data, crc=crc32(data), sz=data.length;
    const lh=new Uint8Array(30+nb.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,sz,true); dv.setUint32(22,sz,true);
    dv.setUint16(26,nb.length,true);
    lh.set(nb,30);
    locais.push(lh,data); total+=lh.length+sz;
    const ch=new Uint8Array(46+nb.length), d2=new DataView(ch.buffer);
    d2.setUint32(0,0x02014b50,true); d2.setUint16(4,20,true); d2.setUint16(6,20,true);
    d2.setUint32(16,crc,true); d2.setUint32(20,sz,true); d2.setUint32(24,sz,true);
    d2.setUint16(28,nb.length,true); d2.setUint32(42,off,true);
    ch.set(nb,46); centrais.push(ch);
    off+=lh.length+sz;
  });
  const cdSize=centrais.reduce((s,c)=>s+c.length,0);
  const eocd=new Uint8Array(22), de=new DataView(eocd.buffer);
  de.setUint32(0,0x06054b50,true);
  de.setUint16(8,files.length,true); de.setUint16(10,files.length,true);
  de.setUint32(12,cdSize,true); de.setUint32(16,total,true);
  const out=new Uint8Array(total+cdSize+22); let pos=0;
  locais.forEach(b=>{out.set(b,pos);pos+=b.length;});
  centrais.forEach(b=>{out.set(b,pos);pos+=b.length;});
  out.set(eocd,pos);
  return out;
}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function colL(n){let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
function abaXML(a){
  const linhas=a.linhas, hdr=a.hdr||0, pct=new Set(a.pct||[]), link=a.link||false;

      if(typeof v==="number" && isFinite(v)) return `<c r="${ref}" s="${st}"><v>${v}</v></c>`;
      if(v===null||v===undefined||v==="") return "";
      return `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
    }).join("");

  }).join("");
  const cols=(a.larg||[]).map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");

}
